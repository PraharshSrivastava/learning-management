# Trust forwarded scheme only from the configured dedicated Docker edge address.
map "$remote_addr:$http_x_forwarded_proto" $lms_forwarded_scheme {
    default $scheme;
    "${TRUSTED_EDGE_PROXY_IP}:https" https;
    "${TRUSTED_EDGE_PROXY_IP}:http" http;
}

map $http_upgrade $websocket_upgrade {
    default "";
    ~*^websocket$ websocket;
}
map $websocket_upgrade $connection_upgrade {
    default close;
    websocket upgrade;
}

# Launch URLs contain credentials. Never log query strings or Referer.
log_format lms_no_query '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 200M;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log lms_no_query;
    # Routine nginx errors include the full request URL, which can contain tokens.
    error_log /var/log/nginx/error.log crit;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    location = /lms/trainer {
        return 308 /lms/trainer/$is_args$args;
    }

    location = /lms/trainer/index.html {
        alias /usr/share/nginx/html/index.html;
        sub_filter '<base href="/">' '<base href="/lms/trainer/">';
        sub_filter_once on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lms_forwarded_scheme;
        proxy_set_header X-LMS-App trainer;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /assets/videos/ {
        alias /srv/lms/videos/;
        sendfile on;
        tcp_nopush on;
        etag on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4 m4s;
        }
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri @root_backend_assets;
        add_header Cache-Control "public, no-cache" always;
    }

    location @root_backend_assets {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lms_forwarded_scheme;
        proxy_set_header X-LMS-App trainer;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /lms/trainer/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lms_forwarded_scheme;
        proxy_set_header X-LMS-App trainer;
        proxy_set_header X-Forwarded-Prefix "/lms/trainer";
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /lms/trainer/assets/videos/ {
        alias /srv/lms/videos/;
        sendfile on;
        tcp_nopush on;
        etag on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4 m4s;
        }
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, no-cache" always;
    }

    location ^~ /lms/trainer/assets/ {
        rewrite ^/lms/trainer/(.*)$ /$1 break;
        try_files $uri @prefixed_backend_assets;
        add_header Cache-Control "public, no-cache" always;
    }

    location @prefixed_backend_assets {
        rewrite ^/lms/trainer/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lms_forwarded_scheme;
        proxy_set_header X-LMS-App trainer;
        proxy_set_header X-Forwarded-Prefix "/lms/trainer";
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /lms/trainer/ {
        rewrite ^/lms/trainer/(.*)$ /$1 break;
        try_files $uri /lms/trainer/index.html;
        sub_filter '<base href="/">' '<base href="/lms/trainer/">';
        sub_filter_once on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Missing build files must return 404, not the SPA entry page.
    location ~ ^(?:/lms/trainer)?/(?:flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|manifest\.json|canvaskit/.*|icons/.*|favicon\.png)$ {
        rewrite ^/lms/trainer/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
