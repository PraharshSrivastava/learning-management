<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bullets template gallery</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    html, body { width: auto; height: auto; min-height: 100%; overflow: auto; display: block; background: #202a35; }
    body { color: #fff; font-family: Barlow, Arial, sans-serif; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 18px 16px 12px; }
    .controls span { margin-left: 8px; color: #d4e0e9; font-size: 14px; font-weight: 600; }
    button { border: 1px solid rgba(255,255,255,.26); border-radius: 99px; padding: 8px 13px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font: 600 14px Barlow, Arial, sans-serif; }
    button.active { border-color: var(--pc-blue-accent); background: var(--pc-blue-accent); color: var(--pc-deep-navy); }
    .caption { margin: 0 0 14px; color: #d4e0e9; text-align: center; font-size: 14px; }
    .frame { width: min(1280px, 100vw); margin: 0 auto 28px; box-shadow: 0 14px 42px rgba(0,0,0,.38); }
    .slide { position: relative; display: flex; flex-direction: column; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; padding: 20px 58px 18px; background: linear-gradient(100deg, var(--pc-blue-wash) 0%, var(--pc-blue-mid) 52%, var(--pc-peach-wash) 100%); color: var(--pc-body); opacity: 1; }
    .brand-header { position: relative; display: flex; min-height: 96px; align-items: flex-start; margin: 0 -20px 2px; padding: 41px 20px 0; flex-shrink: 0; }
    .context { position: relative; max-width: 820px; padding-left: 14px; color: var(--pc-primary); font-size: 24px; line-height: 34px; font-weight: 600; }
    .context:before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 0; width: 3px; background: var(--pc-primary); }
    .brand-lockup { position: absolute; top: 28px; right: -38px; width: 216px; color: var(--pc-primary); }
    .brand-name { height: 34px; padding: 0 8px; font-size: 25px; line-height: 30px; font-weight: 700; text-align: center; }
    .brand-tagline { height: 26px; padding: 0 10px; background: var(--pc-primary); color: #fff; font-size: 12px; line-height: 26px; font-weight: 500; text-align: center; white-space: nowrap; }
    .body { position: relative; display: grid; min-height: 0; flex: 1; overflow: hidden; }
    .slide.has-images .body { grid-template-columns: minmax(0, 1fr) minmax(340px, .60fr); gap: 24px; }
    .content-area { min-width: 0; min-height: 0; overflow: hidden; }
    .footer { position: relative; height: 38px; margin: 0 -20px; flex-shrink: 0; }
    .footer:before { content: ""; position: absolute; top: 12px; left: 20px; right: 22px; height: 1px; background: linear-gradient(90deg, rgba(29,58,120,.64), rgba(245,170,143,.72)); }
    .page { position: absolute; top: 2px; right: 0; color: var(--pc-primary); font-size: 14px; font-weight: 600; }

    .image-grid { display: none; min-width: 0; min-height: 0; gap: 10px; padding: 10px; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(100deg, rgba(255,255,255,.52), rgba(255,255,255,.24)); }
    .has-images .image-grid { display: grid; }
    .image { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.94); background: rgba(255,255,255,.52); }
    .image img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .count-3 .image:first-child { grid-row: span 2; }

    .bullet-fit { --bullet-size: 21px; --bullet-line: 1.22; --num-size: 26px; height: 100%; }
    .bullet-fit.items-1 { --bullet-size: 32px; --bullet-line: 1.22; --num-size: 42px; }
    .bullet-fit.items-2 { --bullet-size: 27px; --bullet-line: 1.22; --num-size: 34px; }
    .bullet-fit.items-3 { --bullet-size: 23px; --bullet-line: 1.20; --num-size: 30px; }
    .bullet-fit.items-4 { --bullet-size: 19px; --bullet-line: 1.16; --num-size: 25px; }
    .bullet-fit.items-5 { --bullet-size: 16px; --bullet-line: 1.10; --num-size: 21px; }
    .has-images .bullet-fit.items-1 { --bullet-size: 25px; --bullet-line: 1.16; --num-size: 32px; }
    .has-images .bullet-fit.items-2 { --bullet-size: 20px; --bullet-line: 1.13; --num-size: 27px; }
    .has-images .bullet-fit.items-3 { --bullet-size: 16px; --bullet-line: 1.08; --num-size: 22px; }
    .has-images .bullet-fit.items-4 { --bullet-size: 13px; --bullet-line: 1.04; --num-size: 18px; }
    .has-images .bullet-fit.items-5 { --bullet-size: 10.5px; --bullet-line: 1.02; --num-size: 15px; }

    .numbered-list { display: grid; grid-template-rows: repeat(var(--items), minmax(0, 1fr)); height: 100%; gap: 12px; }
    .numbered-item { display: grid; grid-template-columns: 84px minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(110deg, rgba(255,255,255,.74), rgba(255,255,255,.34)); }
    .numbered-index { display: flex; align-items: center; justify-content: center; min-height: 0; background: linear-gradient(145deg, var(--pc-primary), #102544); color: #fff; font-size: var(--num-size); line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .numbered-text { display: flex; min-width: 0; min-height: 0; align-items: center; margin: 0; padding: 10px 26px; color: var(--pc-body); font-size: var(--bullet-size); line-height: var(--bullet-line); font-weight: 500; overflow-wrap: anywhere; }
    .numbered-list.items-5 { gap: 9px; }
    .has-images .numbered-list { gap: 8px; }
    .has-images .numbered-item { grid-template-columns: 52px minmax(0, 1fr); border-radius: 14px; }
    .has-images .numbered-text { padding: 7px 14px; }

    .takeaway-layout { display: grid; grid-template-rows: minmax(112px, .72fr) minmax(0, 1fr); height: 100%; gap: 18px; }
    .takeaway-hero { position: relative; display: flex; min-width: 0; min-height: 0; align-items: center; overflow: hidden; padding: 26px 36px 24px 124px; border: 1px solid rgba(255,255,255,.92); border-radius: 18px; background: linear-gradient(116deg, rgba(29,58,120,.96), rgba(14,40,65,.86) 54%, rgba(255,255,255,.23)); color: #fff; }
    .takeaway-hero:before { content: "01"; position: absolute; left: 34px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.28); font-size: 68px; line-height: 1; font-weight: 800; letter-spacing: -.05em; }
    .hero-text { min-width: 0; margin: 0; font-size: calc(var(--bullet-size) + 4px); line-height: var(--bullet-line); font-weight: 650; overflow-wrap: anywhere; }
    .support-list { display: grid; grid-template-rows: repeat(var(--support), minmax(0, 1fr)); min-height: 0; gap: 10px; }
    .support-list.empty { display: none; }
    .support-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.88); border-radius: 14px; background: linear-gradient(108deg, rgba(255,255,255,.68), rgba(255,255,255,.30)); }
    .support-num { display: flex; align-items: center; justify-content: center; color: var(--pc-primary); font-size: var(--num-size); font-weight: 800; font-variant-numeric: tabular-nums; border-right: 1px solid rgba(29,58,120,.18); }
    .support-text { display: flex; align-items: center; min-width: 0; min-height: 0; margin: 0; padding: 8px 18px; color: var(--pc-body); font-size: calc(var(--bullet-size) - 2px); line-height: var(--bullet-line); font-weight: 500; overflow-wrap: anywhere; }
    .takeaway-layout.items-1 { grid-template-rows: 1fr; }
    .takeaway-layout.items-1 .takeaway-hero { padding-right: 54px; }
    .takeaway-layout.items-2 { grid-template-rows: minmax(0, 1fr) minmax(86px, .48fr); }
    .takeaway-layout.items-4, .takeaway-layout.items-5 { grid-template-rows: minmax(90px, .58fr) minmax(0, 1fr); gap: 12px; }
    .takeaway-layout.items-4 .takeaway-hero, .takeaway-layout.items-5 .takeaway-hero { padding-top: 18px; padding-bottom: 18px; }
    .has-images .takeaway-layout { grid-template-rows: minmax(84px, .46fr) minmax(0, 1fr); gap: 10px; }
    .has-images .takeaway-layout.items-1 { grid-template-rows: 1fr; }
    .has-images .takeaway-layout.items-2 { grid-template-rows: minmax(0, 1fr) minmax(72px, .45fr); }
    .has-images .takeaway-hero { padding: 14px 18px 14px 70px; border-radius: 15px; }
    .has-images .takeaway-hero:before { left: 18px; font-size: 43px; }
    .has-images .support-list { gap: 7px; }
    .has-images .support-item { grid-template-columns: 40px minmax(0, 1fr); border-radius: 12px; }
    .has-images .support-text { padding: 6px 11px; }
    /* Revised variants: open editorial rows that preserve a comfortable reading measure. */
    .bullet-fit { --bullet-size: 21px; --bullet-line: 1.28; --num-size: 30px; }
    .bullet-fit.items-1 { --bullet-size: 30px; }
    .bullet-fit.items-2 { --bullet-size: 25px; }
    .bullet-fit.items-3 { --bullet-size: 22px; }
    .bullet-fit.items-4 { --bullet-size: 19px; }
    .bullet-fit.items-5 { --bullet-size: 17px; }
    .numbered-list, .editorial-list { display: grid; grid-template-rows: repeat(var(--items), minmax(0, 1fr)); height: 100%; margin: 0; padding: 0; list-style: none; }
    .numbered-list { gap: 0; }
    .numbered-item { display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: center; min-width: 0; min-height: 0; overflow: hidden; border: 0; border-bottom: 1px solid var(--pc-line); border-radius: 0; background: none; }
    .numbered-item:first-child { border-top: 1px solid var(--pc-line); }
    .numbered-index { display: flex; align-items: center; justify-content: flex-start; min-height: 0; background: none; color: var(--pc-primary); font-size: var(--num-size); font-weight: 700; letter-spacing: -.04em; }
    .numbered-text { display: block; min-width: 0; min-height: 0; margin: 0; padding: 11px 0 11px 4px; color: var(--pc-body); font-size: var(--bullet-size); line-height: var(--bullet-line); font-weight: 500; overflow-wrap: anywhere; }
    .editorial-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; min-width: 0; min-height: 0; padding: 10px 0 10px 24px; border-left: 3px solid var(--pc-peach-accent); background: linear-gradient(90deg, rgba(255,255,255,.48), rgba(255,255,255,0)); }
    .editorial-item + .editorial-item { border-top: 1px solid rgba(29,58,120,.20); }
    .editorial-index { color: var(--pc-primary); font-size: 32px; font-weight: 700; letter-spacing: -.04em; }
    .editorial-text { min-width: 0; margin: 0; color: var(--pc-body); font-size: var(--bullet-size); line-height: var(--bullet-line); font-weight: 500; overflow-wrap: anywhere; }
    .has-images .bullet-fit.items-1 { --bullet-size: 24px; }
    .has-images .bullet-fit.items-2 { --bullet-size: 20px; }
    .has-images .bullet-fit.items-3 { --bullet-size: 16px; }
    .has-images .bullet-fit.items-4, .has-images .bullet-fit.items-5 { --bullet-size: 13px; }
  </style>
</head>
<body>
  <div class="controls">
    <span>Bullets template</span>
    <button class="active" data-variant="editorial">Variant A · Editorial sequence</button>
    <button data-variant="numbered">Variant B · Pipeline numbered rows</button>
    <span>Bullets</span>
    <button data-items="1">1</button>
    <button data-items="2">2</button>
    <button class="active" data-items="3">3</button>
    <button data-items="4">4</button>
    <button data-items="5">5</button>
    <span>Images</span>
    <button class="active" data-images="0">0</button>
    <button data-images="1">1</button>
    <button data-images="2">2</button>
    <button data-images="3">3</button>
    <span>Bullet length</span>
    <button class="active" data-length="normal">Normal</button>
    <button data-length="long">Long stress</button>
  </div>
  <p class="caption" id="caption">Variant A · Numbered list · 3 bullets · 0 images · normal text</p>

  <div class="frame">
    <main class="slide no-images" id="slide">
      <header class="brand-header">
        <div class="context">Building Better Decision Habits</div>
        <div class="brand-lockup">
          <div class="brand-name">PhillipCapital</div>
          <div class="brand-tagline">Wealth. Across Chapters.</div>
        </div>
      </header>
      <div class="body" id="body">
        <div class="content-area" id="content"></div>
      </div>
      <footer class="footer"><span class="page">05</span></footer>
    </main>
  </div>

  <script>
    const normalBullets = [
      'Use the available evidence before acting, especially when the decision affects clients, controls, or long-term outcomes.',
      'Apply the same reasoning consistently across similar cases so decisions remain fair, explainable, and easy to review.',
      'Escalate early when facts are missing, conflicting, or too uncertain for a reliable decision.',
      'Document the rationale clearly so another reviewer can understand what was considered and why the choice was made.',
      'Review the result afterward and use the lesson to improve future decisions.'
    ];
    const longBullets = [
      'Use the available evidence before acting, especially when the decision affects clients, operational controls, regulatory exposure, or long-term business outcomes.',
      'Apply the same reasoning consistently across similar cases so decisions remain fair, explainable, reviewable, and aligned with the organisation’s stated approach.',
      'Escalate early when facts are missing, conflicting, time-sensitive, or too uncertain for a reliable decision to be made at the current level.',
      'Document the rationale clearly so another reviewer can understand what evidence was considered, what trade-offs were accepted, and why the choice was made.',
      'Review the result afterward, compare it with the intended outcome, and use the lesson to improve similar decisions in the future.'
    ];

    let variant = 'editorial';
    let itemCount = 3;
    let imageCount = 0;
    let textLength = 'normal';
    const images = ['images/course_1784265088_0/page_2_img_1_22.jpeg', 'images/course_1784265088_0/page_4_img_1_27.jpeg', 'images/course_1784269956_1/page_10_img_1_35.png'];

    const currentBullets = () => (textLength === 'long' ? longBullets : normalBullets).slice(0, itemCount);
    const fitClass = () => `bullet-fit items-${itemCount}`;
    const imageMarkup = () => `<aside class="image-grid count-${imageCount}" aria-label="Course source images">${images.slice(0, imageCount).map(src => `<div class="image"><img src="${src}" alt="Course source image"></div>`).join('')}</aside>`;

    function renderNumbered() {
      return `<div class="${fitClass()} numbered-list items-${itemCount}" style="--items:${itemCount}">${currentBullets().map((text, i) => `
        <section class="numbered-item">
          <div class="numbered-index">${String(i + 1).padStart(2, '0')}</div>
          <p class="numbered-text">${text}</p>
        </section>
      `).join('')}</div>`;
    }

    function renderEditorial() {
      return `<div class="${fitClass()} editorial-list" style="--items:${itemCount}">${currentBullets().map((text, i) => `
        <section class="editorial-item"><div class="editorial-index">${String(i + 1).padStart(2, '0')}</div><p class="editorial-text">${text}</p></section>
      `).join('')}</div>`;
    }

    function renderTakeaway() {
      const bullets = currentBullets();
      const support = bullets.slice(1);
      return `<div class="${fitClass()} takeaway-layout items-${itemCount}" style="--support:${Math.max(support.length, 1)}">
        <section class="takeaway-hero"><p class="hero-text">${bullets[0]}</p></section>
        <div class="support-list ${support.length ? '' : 'empty'}">
          ${support.map((text, i) => `<section class="support-item"><div class="support-num">${String(i + 2).padStart(2, '0')}</div><p class="support-text">${text}</p></section>`).join('')}
        </div>
      </div>`;
    }

    function fitText() {
      document.querySelectorAll('.numbered-text, .editorial-text, .hero-text, .support-text').forEach(el => {
        let size = parseFloat(getComputedStyle(el).fontSize);
        while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 7.2) {
          size -= 0.25;
          el.style.fontSize = `${size}px`;
          el.style.lineHeight = '1.02';
        }
      });
    }

    function redraw() {
      const slide = document.querySelector('#slide');
      const body = document.querySelector('#body');
      slide.className = `slide ${imageCount ? 'has-images' : 'no-images'}`;
      body.innerHTML = `<div class="content-area" id="content">${variant === 'editorial' ? renderEditorial() : renderNumbered()}</div>${imageCount ? imageMarkup() : ''}`;
      document.querySelector('#caption').textContent = `Variant ${variant === 'editorial' ? 'A · Editorial sequence' : 'B · Pipeline numbered rows'} · ${itemCount} bullet${itemCount === 1 ? '' : 's'} · ${imageCount} image${imageCount === 1 ? '' : 's'} · ${textLength === 'long' ? 'long stress text' : 'normal text'}`;
      document.querySelectorAll('[data-variant]').forEach(b => b.classList.toggle('active', b.dataset.variant === variant));
      document.querySelectorAll('[data-items]').forEach(b => b.classList.toggle('active', +b.dataset.items === itemCount));
      document.querySelectorAll('[data-images]').forEach(b => b.classList.toggle('active', +b.dataset.images === imageCount));
      document.querySelectorAll('[data-length]').forEach(b => b.classList.toggle('active', b.dataset.length === textLength));
      requestAnimationFrame(fitText);
    }

    document.querySelectorAll('[data-variant]').forEach(b => b.onclick = () => { variant = b.dataset.variant; redraw(); });
    document.querySelectorAll('[data-items]').forEach(b => b.onclick = () => { itemCount = +b.dataset.items; redraw(); });
    document.querySelectorAll('[data-images]').forEach(b => b.onclick = () => { imageCount = +b.dataset.images; redraw(); });
    document.querySelectorAll('[data-length]').forEach(b => b.onclick = () => { textLength = b.dataset.length; redraw(); });
    redraw();
  </script>
</body>
</html>
