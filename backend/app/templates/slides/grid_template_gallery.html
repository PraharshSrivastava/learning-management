<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid template gallery</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    html, body { width: auto; height: auto; min-height: 100%; overflow: auto; display: block; background: #202a35; }
    body { color: #fff; font-family: Barlow, Arial, sans-serif; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 18px 16px 12px; }
    .controls span { margin-left: 8px; color: #d4e0e9; font-size: 14px; font-weight: 600; }
    button { border: 1px solid rgba(255,255,255,.26); border-radius: 99px; padding: 8px 13px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font: 600 14px Barlow, Arial, sans-serif; }
    button.active { border-color: var(--pc-blue-accent); background: var(--pc-blue-accent); color: var(--pc-deep-navy); }
    .caption { margin: 0 0 14px; color: #d4e0e9; text-align: center; font-size: 14px; }
    .frame { width: min(1280px, 100vw); margin: 0 auto 28px; box-shadow: 0 14px 42px rgba(0,0,0,.38); }
    .slide { position: relative; display: flex; flex-direction: column; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; padding: 20px 58px 18px; background: linear-gradient(100deg, var(--pc-blue-wash) 0%, var(--pc-blue-mid) 52%, var(--pc-peach-wash) 100%); color: var(--pc-body); opacity: 1; }
    .brand-header { position: relative; display: flex; min-height: 96px; align-items: flex-start; margin: 0 -20px 2px; padding: 41px 20px 0; flex-shrink: 0; }
    .context { position: relative; max-width: 820px; padding-left: 14px; color: var(--pc-primary); font-size: 24px; line-height: 34px; font-weight: 600; }
    .context:before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 0; width: 3px; background: var(--pc-primary); }
    .brand-lockup { position: absolute; top: 28px; right: -38px; width: 216px; color: var(--pc-primary); }
    .brand-name { height: 34px; padding: 0 8px; font-size: 25px; line-height: 30px; font-weight: 700; text-align: center; }
    .brand-tagline { height: 26px; padding: 0 10px; background: var(--pc-primary); color: #fff; font-size: 12px; line-height: 26px; font-weight: 500; text-align: center; white-space: nowrap; }
    .body { position: relative; display: grid; min-height: 0; flex: 1; overflow: hidden; }
    .slide.has-images .body { grid-template-columns: minmax(0, 1fr) minmax(340px, .62fr); gap: 24px; }
    .content-area { min-width: 0; min-height: 0; overflow: hidden; }
    .footer { position: relative; height: 38px; margin: 0 -20px; flex-shrink: 0; }
    .footer:before { content: ""; position: absolute; top: 12px; left: 20px; right: 22px; height: 1px; background: linear-gradient(90deg, rgba(29,58,120,.64), rgba(245,170,143,.72)); }
    .page { position: absolute; top: 2px; right: 0; color: var(--pc-primary); font-size: 14px; font-weight: 600; }

    .image-grid { display: none; min-width: 0; min-height: 0; gap: 10px; padding: 10px; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(100deg, rgba(255,255,255,.52), rgba(255,255,255,.24)); }
    .has-images .image-grid { display: grid; }
    .image { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.94); background: rgba(255,255,255,.52); }
    .image img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .image-grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .image-grid.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .image-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .image-grid.count-3 .image:first-child { grid-row: span 2; }

    .grid-fit { height: 100%; }
    .gallery-grid { display: grid; height: 100%; gap: 18px; }
    .gallery-grid.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gallery-grid.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .gallery-grid.count-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gallery-grid.count-5, .gallery-grid.count-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .has-images .gallery-grid.count-3, .has-images .gallery-grid.count-4, .has-images .gallery-grid.count-5, .has-images .gallery-grid.count-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

    .insight-card { position: relative; display: grid; grid-template-columns: 66px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 17px; min-width: 0; min-height: 0; overflow: hidden; padding: 22px 24px; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(122deg, rgba(255,255,255,.72), rgba(255,255,255,.32)); box-shadow: inset 0 1px 0 rgba(255,255,255,.62); }
    .insight-card:before { content: ""; position: absolute; top: 18px; left: 24px; width: 72px; height: 4px; background: var(--pc-primary); }
    .insight-num { grid-row: 1 / span 2; align-self: start; padding-top: 18px; color: var(--pc-primary); font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .insight-icon { position: absolute; right: 22px; bottom: 18px; width: 42px; height: 42px; object-fit: contain; opacity: .18; }
    .insight-card h3 { min-width: 0; margin: 18px 42px 0 0; color: var(--pc-primary); font-size: 21px; line-height: 1.08; font-weight: 700; }
    .insight-card ul { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin: 11px 0 0; padding: 0; list-style: none; }
    .insight-card li { min-width: 0; color: #1f1f1f; font-size: 14px; line-height: 1.28; overflow-wrap: anywhere; }
    .insight-card li + li { padding-top: 8px; border-top: 1px solid rgba(29,58,120,.16); }

    .lane-grid { gap: 10px 18px; }
    .lane-card { display: grid; grid-template-columns: 84px minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(105deg, rgba(255,255,255,.70), rgba(255,255,255,.33)); box-shadow: inset 0 1px 0 rgba(255,255,255,.58); }
    .lane-num { display: flex; align-items: center; justify-content: center; min-height: 0; background: linear-gradient(145deg, var(--pc-primary), #102544); color: #fff; font-size: 27px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lane-copy { min-width: 0; min-height: 0; padding: 18px 22px; overflow: hidden; }
    .lane-copy h3 { margin: 0; color: var(--pc-primary); font-size: 20px; line-height: 1.08; font-weight: 700; }
    .lane-copy ul { display: flex; flex-direction: column; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
    .lane-copy li { position: relative; min-width: 0; padding-left: 13px; color: #1f1f1f; font-size: 13.5px; line-height: 1.24; overflow-wrap: anywhere; }
    .lane-copy li:before { content: ""; position: absolute; left: 0; top: .54em; width: 5px; height: 1px; background: var(--pc-primary); }

    .count-5 .insight-card, .count-6 .insight-card { grid-template-columns: 48px minmax(0, 1fr); column-gap: 11px; padding: 15px 16px; }
    .count-5 .insight-card:before, .count-6 .insight-card:before { top: 12px; left: 16px; width: 52px; height: 3px; }
    .count-5 .insight-num, .count-6 .insight-num { padding-top: 14px; font-size: 21px; }
    .count-5 .insight-icon, .count-6 .insight-icon { width: 30px; height: 30px; right: 14px; bottom: 12px; }
    .count-5 .insight-card h3, .count-6 .insight-card h3 { margin-top: 15px; margin-right: 30px; font-size: 16px; }
    .count-5 .insight-card ul, .count-6 .insight-card ul { gap: 4px; margin-top: 7px; }
    .count-5 .insight-card li, .count-6 .insight-card li { font-size: 11.2px; line-height: 1.13; }
    .count-5 .insight-card li + li, .count-6 .insight-card li + li { padding-top: 4px; }
    .count-5 .lane-card, .count-6 .lane-card { grid-template-columns: 52px minmax(0, 1fr); }
    .count-5 .lane-num, .count-6 .lane-num { font-size: 20px; }
    .count-5 .lane-copy, .count-6 .lane-copy { padding: 11px 12px; }
    .count-5 .lane-copy h3, .count-6 .lane-copy h3 { font-size: 15.5px; }
    .count-5 .lane-copy ul, .count-6 .lane-copy ul { gap: 4px; margin-top: 6px; }
    .count-5 .lane-copy li, .count-6 .lane-copy li { font-size: 11px; line-height: 1.12; }

    .has-images .insight-card { grid-template-columns: 36px minmax(0, 1fr); column-gap: 8px; padding: 10px 12px; border-radius: 13px; }
    .has-images .insight-card:before { top: 9px; left: 12px; width: 42px; height: 3px; }
    .has-images .insight-num { padding-top: 12px; font-size: 16px; }
    .has-images .insight-icon { display: none; }
    .has-images .insight-card h3 { margin-top: 12px; margin-right: 0; font-size: 12.8px; }
    .has-images .insight-card ul { gap: 3px; margin-top: 5px; }
    .has-images .insight-card li { font-size: 9px; line-height: 1.05; }
    .has-images .insight-card li + li { padding-top: 3px; }
    .has-images .lane-card { grid-template-columns: 34px minmax(0, 1fr); border-radius: 13px; }
    .has-images .lane-num { font-size: 15px; }
    .has-images .lane-copy { padding: 8px 9px; }
    .has-images .lane-copy h3 { font-size: 12.4px; }
    .has-images .lane-copy ul { gap: 3px; margin-top: 4px; }
    .has-images .lane-copy li { padding-left: 8px; font-size: 8.8px; line-height: 1.04; }
  </style>
</head>
<body>
  <div class="controls">
    <span>Grid template</span>
    <button class="active" data-variant="insight">Variant A &middot; Insight cards</button>
    <button data-variant="lanes">Variant B &middot; Structured lanes</button>
    <span>Grid count</span>
    <button class="active" data-count="2">2</button>
    <button data-count="3">3</button>
    <button data-count="4">4</button>
    <button data-count="5">5</button>
    <button data-count="6">6</button>
    <span>Images</span>
    <button class="active" data-images="0">0</button>
    <button data-images="1">1</button>
    <button data-images="2">2</button>
    <button data-images="3">3</button>
    <span>Point length</span>
    <button class="active" data-length="normal">Normal</button>
    <button data-length="long">Long stress</button>
  </div>
  <p class="caption" id="caption">Variant A &middot; Insight cards &middot; 2 grid items &middot; 0 images &middot; normal text</p>

  <div class="frame">
    <main class="slide no-images" id="slide">
      <header class="brand-header">
        <div class="context">Key Elements of a Disciplined Investment Process</div>
        <div class="brand-lockup">
          <div class="brand-name">PhillipCapital</div>
          <div class="brand-tagline">Wealth. Across Chapters.</div>
        </div>
      </header>
      <div class="body" id="body">
        <div class="content-area" id="content"></div>
      </div>
      <footer class="footer"><span class="page">04</span></footer>
    </main>
  </div>

  <script>
    const normalItems = [
      ['Clear objectives', ['Define the intended outcome before choosing an action.', 'Keep each decision connected to the wider strategy.']],
      ['Relevant evidence', ['Use current facts, credible research, and practical context.', 'Separate material signals from background noise.']],
      ['Risk discipline', ['Consider downside scenarios before committing resources.', 'Use controls that remain useful when conditions change.']],
      ['Active review', ['Monitor results against the original assumptions.', 'Adjust when evidence no longer supports the decision.']],
      ['Consistent execution', ['Apply the framework consistently across comparable situations.', 'Document the rationale for later review.']],
      ['Learning loop', ['Use outcomes to strengthen future judgement.', 'Share lessons that improve the wider team.']]
    ];

    const longItems = [
      ['Clear objectives', ['Define the intended outcome before choosing an action, including the client result, operational boundary, and decision standard that should guide the work.', 'Keep every later decision connected to the wider strategy so activity does not drift into disconnected tasks.']],
      ['Relevant evidence', ['Use current facts, credible research, and practical context before moving from analysis into action.', 'Separate material signals from background noise when information is incomplete, time-sensitive, or difficult to compare.']],
      ['Risk discipline', ['Consider downside scenarios before committing resources, especially when the decision affects clients, controls, approvals, or long-term outcomes.', 'Use controls that remain useful when market conditions, operational constraints, or stakeholder expectations change.']],
      ['Active review', ['Monitor results against the original assumptions so the team can see whether the decision is still supported by evidence.', 'Adjust when evidence no longer supports the decision, and document why the approach changed.']],
      ['Consistent execution', ['Apply the framework consistently across comparable situations so decisions remain fair, explainable, and easy to review later.', 'Document the rationale in plain language so another reviewer can understand what was considered and why the choice was made.']],
      ['Learning loop', ['Use outcomes to strengthen future judgement by comparing actual results with the original expectation.', 'Share lessons that improve the wider team instead of leaving insight trapped in one decision or one person.']]
    ];

    let variant = 'insight';
    let gridCount = 2;
    let imageCount = 0;
    let pointLength = 'normal';
    const images = ['images/course_1784265088_0/page_2_img_1_22.jpeg', 'images/course_1784265088_0/page_4_img_1_27.jpeg', 'images/course_1784269956_1/page_10_img_1_35.png'];

    const currentItems = () => (pointLength === 'long' ? longItems : normalItems).slice(0, gridCount);
    const icon = index => `<img class="insight-icon" src="brand/icon-${10 + (index % 14)}.svg" alt="">`;
    const imageMarkup = () => `<aside class="image-grid count-${imageCount}" aria-label="Course source images">${images.slice(0, imageCount).map(src => `<div class="image"><img src="${src}" alt="Course source image"></div>`).join('')}</aside>`;

    function renderGrid() {
      const cards = currentItems().map(([heading, points], index) => {
        if (variant === 'lanes') {
          return `<section class="lane-card">
            <div class="lane-num">${String(index + 1).padStart(2, '0')}</div>
            <div class="lane-copy">
              <h3>${heading}</h3>
              <ul>${points.map(point => `<li>${point}</li>`).join('')}</ul>
            </div>
          </section>`;
        }

        return `<section class="insight-card">
          <div class="insight-num">${String(index + 1).padStart(2, '0')}</div>
          ${icon(index)}
          <h3>${heading}</h3>
          <ul>${points.map(point => `<li>${point}</li>`).join('')}</ul>
        </section>`;
      }).join('');
      return `<div class="grid-fit"><div class="gallery-grid ${variant === 'lanes' ? 'lane-grid' : 'insight-grid'} count-${gridCount}">${cards}</div></div>`;
    }

    function fitText() {
      document.querySelectorAll('.insight-card h3, .insight-card li, .lane-copy h3, .lane-copy li').forEach(el => {
        let size = parseFloat(getComputedStyle(el).fontSize);
        while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 7) {
          size -= 0.25;
          el.style.fontSize = `${size}px`;
          el.style.lineHeight = '1.02';
        }
      });
    }

    function redraw() {
      const slide = document.querySelector('#slide');
      const body = document.querySelector('#body');
      slide.className = `slide ${imageCount ? 'has-images' : 'no-images'}`;
      body.innerHTML = `<div class="content-area" id="content">${renderGrid()}</div>${imageCount ? imageMarkup() : ''}`;
      const dot = '\u00b7';
      document.querySelector('#caption').textContent = `Variant ${variant === 'insight' ? 'A ' + dot + ' Insight cards' : 'B ' + dot + ' Structured lanes'} ${dot} ${gridCount} grid item${gridCount === 1 ? '' : 's'} ${dot} ${imageCount} image${imageCount === 1 ? '' : 's'} ${dot} ${pointLength === 'long' ? 'long stress text' : 'normal text'}`;
      document.querySelectorAll('[data-variant]').forEach(b => b.classList.toggle('active', b.dataset.variant === variant));
      document.querySelectorAll('[data-count]').forEach(b => b.classList.toggle('active', +b.dataset.count === gridCount));
      document.querySelectorAll('[data-images]').forEach(b => b.classList.toggle('active', +b.dataset.images === imageCount));
      document.querySelectorAll('[data-length]').forEach(b => b.classList.toggle('active', b.dataset.length === pointLength));
      requestAnimationFrame(fitText);
    }

    document.querySelectorAll('[data-variant]').forEach(b => b.onclick = () => { variant = b.dataset.variant; redraw(); });
    document.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { gridCount = +b.dataset.count; redraw(); });
    document.querySelectorAll('[data-images]').forEach(b => b.onclick = () => { imageCount = +b.dataset.images; redraw(); });
    document.querySelectorAll('[data-length]').forEach(b => b.onclick = () => { pointLength = b.dataset.length; redraw(); });
    redraw();
  </script>
</body>
</html>
