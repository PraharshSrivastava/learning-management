<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steps template gallery</title>
  <link rel="stylesheet" href="slides.css">
  <style>
    html, body { width: auto; height: auto; min-height: 100%; overflow: auto; display: block; background: #202a35; }
    body { color: #fff; font-family: Barlow, Arial, sans-serif; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 18px 16px 12px; }
    .controls span { margin-left: 8px; color: #d4e0e9; font-size: 14px; font-weight: 600; }
    button { border: 1px solid rgba(255,255,255,.26); border-radius: 99px; padding: 8px 13px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font: 600 14px Barlow, Arial, sans-serif; }
    button.active { border-color: var(--pc-blue-accent); background: var(--pc-blue-accent); color: var(--pc-deep-navy); }
    .caption { margin: 0 0 14px; color: #d4e0e9; text-align: center; font-size: 14px; }
    .frame { width: min(1280px, 100vw); margin: 0 auto 28px; box-shadow: 0 14px 42px rgba(0,0,0,.38); }
    .slide { position: relative; display: flex; flex-direction: column; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; padding: 20px 58px 18px; background: linear-gradient(100deg, var(--pc-blue-wash) 0%, var(--pc-blue-mid) 52%, var(--pc-peach-wash) 100%); color: var(--pc-body); opacity: 1; }
    .brand-header { position: relative; display: flex; min-height: 96px; align-items: flex-start; margin: 0 -20px 2px; padding: 41px 20px 0; flex-shrink: 0; }
    .context { position: relative; max-width: 820px; padding-left: 14px; color: var(--pc-primary); font-size: 24px; line-height: 34px; font-weight: 600; }
    .context:before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 0; width: 3px; background: var(--pc-primary); }
    .brand-lockup { position: absolute; top: 28px; right: -38px; width: 216px; color: var(--pc-primary); }
    .brand-name { height: 34px; padding: 0 8px; font-size: 25px; line-height: 30px; font-weight: 700; text-align: center; }
    .brand-tagline { height: 26px; padding: 0 10px; background: var(--pc-primary); color: #fff; font-size: 12px; line-height: 26px; font-weight: 500; text-align: center; white-space: nowrap; }
    .body { position: relative; display: grid; min-height: 0; flex: 1; overflow: hidden; }
    .slide.has-images .body { grid-template-columns: minmax(0, 1fr) minmax(340px, .60fr); gap: 24px; }
    .content-area { min-width: 0; min-height: 0; overflow: hidden; }
    .footer { position: relative; height: 38px; margin: 0 -20px; flex-shrink: 0; }
    .footer:before { content: ""; position: absolute; top: 12px; left: 20px; right: 22px; height: 1px; background: linear-gradient(90deg, rgba(29,58,120,.64), rgba(245,170,143,.72)); }
    .page { position: absolute; top: 2px; right: 0; color: var(--pc-primary); font-size: 14px; font-weight: 600; }

    .image-grid { display: none; min-width: 0; min-height: 0; gap: 10px; padding: 10px; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(100deg, rgba(255,255,255,.52), rgba(255,255,255,.24)); }
    .has-images .image-grid { display: grid; }
    .image { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.94); background: rgba(255,255,255,.52); }
    .image img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .count-3 .image:first-child { grid-row: span 2; }

    .steps-fit { --title-size: 20px; --desc-size: 14px; --desc-line: 1.22; --num-size: 28px; height: 100%; }
    .steps-fit.steps-2 { --title-size: 25px; --desc-size: 17px; --desc-line: 1.28; --num-size: 34px; }
    .steps-fit.steps-3 { --title-size: 22px; --desc-size: 15px; --desc-line: 1.24; --num-size: 30px; }
    .steps-fit.steps-4 { --title-size: 19px; --desc-size: 13.6px; --desc-line: 1.18; --num-size: 26px; }
    .steps-fit.steps-5 { --title-size: 17px; --desc-size: 12.2px; --desc-line: 1.12; --num-size: 23px; }
    .has-images .steps-fit.steps-2 { --title-size: 20px; --desc-size: 13.6px; --desc-line: 1.16; --num-size: 26px; }
    .has-images .steps-fit.steps-3 { --title-size: 17px; --desc-size: 11.8px; --desc-line: 1.10; --num-size: 22px; }
    .has-images .steps-fit.steps-4 { --title-size: 15px; --desc-size: 10.3px; --desc-line: 1.05; --num-size: 19px; }
    .has-images .steps-fit.steps-5 { --title-size: 13px; --desc-size: 9px; --desc-line: 1.02; --num-size: 16px; }

    .step-cards { display: grid; height: 100%; gap: 18px; }
    .step-cards.steps-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .step-cards.steps-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .step-cards.steps-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .step-cards.steps-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .has-images .step-cards { grid-template-columns: 1fr; gap: 10px; }
    .step-card { position: relative; display: grid; grid-template-columns: 70px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 16px; min-width: 0; min-height: 0; overflow: hidden; padding: 20px 22px; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(122deg, rgba(255,255,255,.70), rgba(255,255,255,.32)); box-shadow: inset 0 1px 0 rgba(255,255,255,.62); }
    .step-card:before { content: ""; position: absolute; top: 18px; left: 22px; width: 76px; height: 4px; background: var(--pc-primary); }
    .step-num { grid-row: 1 / span 2; align-self: start; margin-top: 20px; color: var(--pc-primary); font-size: var(--num-size); line-height: .95; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .step-title { min-width: 0; margin: 18px 0 8px; color: var(--pc-primary); font-size: var(--title-size); line-height: 1.05; font-weight: 700; overflow-wrap: anywhere; }
    .step-desc { min-width: 0; min-height: 0; color: var(--pc-body); font-size: var(--desc-size); line-height: var(--desc-line); font-weight: 500; overflow: hidden; }
    .has-images .step-card { grid-template-columns: 52px minmax(0, 1fr); padding: 11px 16px; border-radius: 14px; }
    .has-images .step-card:before { top: 10px; left: 16px; width: 52px; height: 3px; }
    .has-images .step-num { margin-top: 14px; }
    .has-images .step-title { margin: 8px 0 4px; }
    .has-images .step-desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .has-images .steps-4 .step-desc, .has-images .steps-5 .step-desc { -webkit-line-clamp: 2; }

    .step-bands { display: grid; grid-template-rows: repeat(var(--steps), minmax(0, 1fr)); height: 100%; gap: 11px; }
    .step-band { display: grid; grid-template-columns: 92px minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.92); border-radius: 16px; background: linear-gradient(105deg, rgba(255,255,255,.70), rgba(255,255,255,.33)); box-shadow: inset 0 1px 0 rgba(255,255,255,.58); }
    .band-num { display: flex; align-items: center; justify-content: center; min-height: 0; background: linear-gradient(145deg, var(--pc-primary), #102544); color: #fff; font-size: var(--num-size); line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .band-copy { position: relative; display: flex; min-width: 0; min-height: 0; flex-direction: column; justify-content: center; overflow: hidden; padding: 10px 26px 10px 24px; }
    .band-copy:before { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: linear-gradient(180deg, rgba(245,170,143,.85), rgba(29,58,120,.45)); }
    .band-title { margin: 0 0 4px; color: var(--pc-primary); font-size: var(--title-size); line-height: 1.03; font-weight: 700; overflow-wrap: anywhere; }
    .band-desc { min-width: 0; color: var(--pc-body); font-size: var(--desc-size); line-height: var(--desc-line); font-weight: 500; overflow-wrap: anywhere; }
    .step-bands.steps-5 { gap: 9px; }
    .step-bands.steps-5 .band-copy { padding-top: 8px; padding-bottom: 8px; }
    .has-images .step-bands { gap: 7px; }
    .has-images .step-band { grid-template-columns: 54px minmax(0, 1fr); border-radius: 14px; }
    .has-images .band-copy { padding: 7px 14px 7px 13px; }
    .has-images .band-title { margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="controls">
    <span>Steps template</span>
    <button class="active" data-variant="cards">Variant A · Process cards</button>
    <button data-variant="bands">Variant B · Milestone bands</button>
    <span>Steps</span>
    <button class="active" data-steps="2">2</button>
    <button data-steps="3">3</button>
    <button data-steps="4">4</button>
    <button data-steps="5">5</button>
    <span>Images</span>
    <button class="active" data-images="0">0</button>
    <button data-images="1">1</button>
    <button data-images="2">2</button>
    <button data-images="3">3</button>
    <span>Description length</span>
    <button class="active" data-length="normal">Normal</button>
    <button data-length="long">Long stress</button>
  </div>
  <p class="caption" id="caption">Variant A · Process cards · 2 steps · 0 images · normal text</p>

  <div class="frame">
    <main class="slide no-images" id="slide">
      <header class="brand-header">
        <div class="context">Applying a Consistent Decision Process</div>
        <div class="brand-lockup">
          <div class="brand-name">PhillipCapital</div>
          <div class="brand-tagline">Wealth. Across Chapters.</div>
        </div>
      </header>
      <div class="body" id="body">
        <div class="content-area" id="content"></div>
      </div>
      <footer class="footer"><span class="page">04</span></footer>
    </main>
  </div>

  <script>
    const normalSteps = [
      { title: 'Define the decision', description: 'Clarify what must be decided, who owns the decision, and what outcome the team is trying to achieve.' },
      { title: 'Gather evidence', description: 'Use relevant facts, records, and stakeholder input before relying on instinct or incomplete information.' },
      { title: 'Test assumptions', description: 'Check whether the reasoning still holds if conditions, risks, or customer impacts change.' },
      { title: 'Choose and document', description: 'Make the decision using clear criteria, then record the rationale so it can be reviewed later.' },
      { title: 'Review the outcome', description: 'Compare the result with the intended outcome and capture lessons for future decisions.' }
    ];
    const longSteps = [
      { title: 'Define the decision', description: 'Clarify exactly what must be decided, who owns the decision, which stakeholders are affected, and what practical outcome the team is trying to achieve.' },
      { title: 'Gather evidence', description: 'Use relevant facts, records, operational context, and stakeholder input before relying on instinct, precedent, or incomplete information from a single source.' },
      { title: 'Test assumptions', description: 'Check whether the reasoning still holds if conditions, risks, customer impacts, timing, or regulatory expectations change before the action is taken.' },
      { title: 'Choose and document', description: 'Make the decision using clear criteria, then record the rationale, trade-offs, evidence used, and approvals so the choice can be reviewed later.' },
      { title: 'Review the outcome', description: 'Compare the result with the intended outcome, identify what worked or failed, and capture practical lessons that improve future decisions.' }
    ];

    let variant = 'cards';
    let stepCount = 2;
    let imageCount = 0;
    let textLength = 'normal';
    const images = ['images/course_1784265088_0/page_2_img_1_22.jpeg', 'images/course_1784265088_0/page_4_img_1_27.jpeg', 'images/course_1784269956_1/page_10_img_1_35.png'];

    const currentSteps = () => (textLength === 'long' ? longSteps : normalSteps).slice(0, stepCount);
    const fitClass = () => `steps-fit steps-${stepCount}`;
    const imageMarkup = () => `<aside class="image-grid count-${imageCount}" aria-label="Course source images">${images.slice(0, imageCount).map(src => `<div class="image"><img src="${src}" alt="Course source image"></div>`).join('')}</aside>`;

    function renderCards() {
      return `<div class="${fitClass()} step-cards steps-${stepCount}">${currentSteps().map((step, i) => `
        <section class="step-card">
          <div class="step-num">${String(i + 1).padStart(2, '0')}</div>
          <h3 class="step-title">${step.title}</h3>
          <p class="step-desc">${step.description}</p>
        </section>
      `).join('')}</div>`;
    }

    function renderBands() {
      return `<div class="${fitClass()} step-bands steps-${stepCount}" style="--steps:${stepCount}">${currentSteps().map((step, i) => `
        <section class="step-band">
          <div class="band-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="band-copy">
            <h3 class="band-title">${step.title}</h3>
            <p class="band-desc">${step.description}</p>
          </div>
        </section>
      `).join('')}</div>`;
    }

    function fitText() {
      document.querySelectorAll('.step-desc, .band-desc').forEach(el => {
        let size = parseFloat(getComputedStyle(el).fontSize);
        while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 7.2) {
          size -= 0.25;
          el.style.fontSize = `${size}px`;
          el.style.lineHeight = '1.02';
        }
      });
      document.querySelectorAll('.step-title, .band-title').forEach(el => {
        let size = parseFloat(getComputedStyle(el).fontSize);
        while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 9.5) {
          size -= 0.25;
          el.style.fontSize = `${size}px`;
          el.style.lineHeight = '1.02';
        }
      });
    }

    function redraw() {
      const slide = document.querySelector('#slide');
      const body = document.querySelector('#body');
      slide.className = `slide ${imageCount ? 'has-images' : 'no-images'}`;
      body.innerHTML = `<div class="content-area" id="content">${variant === 'cards' ? renderCards() : renderBands()}</div>${imageCount ? imageMarkup() : ''}`;
      document.querySelector('#caption').textContent = `Variant ${variant === 'cards' ? 'A · Process cards' : 'B · Milestone bands'} · ${stepCount} steps · ${imageCount} image${imageCount === 1 ? '' : 's'} · ${textLength === 'long' ? 'long stress descriptions' : 'normal text'}`;
      document.querySelectorAll('[data-variant]').forEach(b => b.classList.toggle('active', b.dataset.variant === variant));
      document.querySelectorAll('[data-steps]').forEach(b => b.classList.toggle('active', +b.dataset.steps === stepCount));
      document.querySelectorAll('[data-images]').forEach(b => b.classList.toggle('active', +b.dataset.images === imageCount));
      document.querySelectorAll('[data-length]').forEach(b => b.classList.toggle('active', b.dataset.length === textLength));
      requestAnimationFrame(fitText);
    }

    document.querySelectorAll('[data-variant]').forEach(b => b.onclick = () => { variant = b.dataset.variant; redraw(); });
    document.querySelectorAll('[data-steps]').forEach(b => b.onclick = () => { stepCount = +b.dataset.steps; redraw(); });
    document.querySelectorAll('[data-images]').forEach(b => b.onclick = () => { imageCount = +b.dataset.images; redraw(); });
    document.querySelectorAll('[data-length]').forEach(b => b.onclick = () => { textLength = b.dataset.length; redraw(); });
    redraw();
  </script>
</body>
</html>
