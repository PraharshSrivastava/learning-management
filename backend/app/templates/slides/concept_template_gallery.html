<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept template gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#1d3a78;--deep:#0e2841;--body:#1f1f1f;--blue-wash:#d0ebf6;--blue-mid:#e7f1f3;--peach-wash:#edddd7;--blue-accent:#abe1fa;--line:rgba(29,58,120,.34)}*{box-sizing:border-box}body{margin:0;background:#202a35;color:#fff;font-family:Barlow,Arial,sans-serif}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:18px 16px 12px}.controls span{margin-left:8px;color:#d4e0e9;font-size:14px;font-weight:600}button{border:1px solid rgba(255,255,255,.26);border-radius:99px;padding:8px 13px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:600 14px Barlow,Arial,sans-serif}button.active{border-color:var(--blue-accent);background:var(--blue-accent);color:var(--deep)}.caption{margin:0 0 14px;color:#d4e0e9;text-align:center;font-size:14px}.frame{width:min(1280px,100vw);margin:0 auto 28px;box-shadow:0 14px 42px rgba(0,0,0,.38)}
    /* Exact shared course-slide chrome. */
    .slide{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:16/9;overflow:hidden;padding:20px 58px 18px;background:linear-gradient(100deg,var(--blue-wash) 0%,var(--blue-mid) 52%,var(--peach-wash) 100%);color:var(--body)}.brand-header{position:relative;display:flex;min-height:96px;align-items:flex-start;margin:0 -20px 2px;padding:41px 20px 0;flex-shrink:0}.context{position:relative;max-width:820px;padding-left:14px;color:var(--primary);font-size:24px;line-height:34px;font-weight:600}.context:before{content:"";position:absolute;top:2px;bottom:2px;left:0;width:3px;background:var(--primary)}.brand-lockup{position:absolute;top:28px;right:-38px;width:216px;color:var(--primary)}.brand-name{height:34px;padding:0 8px;font-size:25px;line-height:30px;font-weight:700;text-align:center}.brand-tagline{height:26px;padding:0 10px;background:var(--primary);color:#fff;font-size:12px;line-height:26px;font-weight:500;text-align:center;white-space:nowrap}.body{position:relative;min-height:0;flex:1;overflow:hidden}.footer{position:relative;height:38px;margin:0 -20px;flex-shrink:0}.footer:before{content:"";position:absolute;top:12px;left:20px;right:22px;height:1px;background:linear-gradient(90deg,rgba(29,58,120,.64),rgba(245,170,143,.72))}.page{position:absolute;top:2px;right:0;color:var(--primary);font-size:14px;font-weight:600}
    /* Shared, source-style components: silver gradient panels and extracted deck icons. */
    .silver-panel{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.92);border-radius:16px;background:linear-gradient(100deg,rgba(255,255,255,.76),rgba(255,255,255,.34))}.icon-tile{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border:1px solid var(--primary);border-radius:10px;background:linear-gradient(135deg,var(--blue-accent),var(--blue-mid) 58%,rgba(255,255,255,.86))}.icon-tile img{width:50px;height:50px;object-fit:contain}.panel-title{color:var(--primary);font-size:42px;font-weight:700;letter-spacing:-.045em;line-height:1.04}.panel-definition{margin-top:19px;color:var(--body);font-size:21px;line-height:1.35}.point-list{display:grid;gap:0}.point{padding:11px 0;border-top:1px solid var(--line);color:var(--deep);font-size:15px;font-weight:600;line-height:1.28;overflow-wrap:anywhere}.point:last-child{border-bottom:1px solid var(--line)}.image-grid{display:none;min-width:0;min-height:0;gap:12px;padding:11px;border:1px solid rgba(255,255,255,.92);border-radius:16px;background:linear-gradient(100deg,rgba(255,255,255,.52),rgba(255,255,255,.24))}.has-images .image-grid{display:grid}.image{min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.94);background:rgba(255,255,255,.52)}.image img{display:block;width:100%;height:100%;object-fit:contain}.count-1{grid-template-columns:1fr;grid-template-rows:1fr}.count-2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.count-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.count-3 .image:first-child{grid-row:span 2}
    /* Template A — full-height statement panel. Image grid is a secondary right column. */
    .statement .body{display:grid;grid-template-columns:1fr}.statement.has-images .body{grid-template-columns:minmax(0,1fr) minmax(300px,.56fr);gap:30px}.statement .silver-panel{display:grid;grid-template-columns:minmax(0,1fr) 114px;grid-template-rows:1fr auto;height:100%;padding:42px 42px 30px}.statement .icon-tile{justify-self:end}.statement .point-list{grid-column:1/-1;grid-template-columns:repeat(var(--point-cols,3),minmax(0,1fr));column-gap:22px;margin-top:26px}.statement .point{padding:13px 0 0;border-bottom:0}.statement .point:last-child{border-bottom:0}.statement .point:before{content:"";display:block;width:28px;height:3px;margin-bottom:9px;background:var(--primary)}.statement.no-images.no-points .body{display:flex;align-items:center;justify-content:center}.statement .empty-statement{width:min(890px,82%);height:auto;min-height:278px;grid-template-columns:minmax(0,1fr) 130px;padding:44px 48px}.statement .empty-statement .panel-definition{max-width:630px}.statement.has-images .silver-panel{grid-template-columns:minmax(0,1fr) 72px;padding:30px 30px 23px}.statement.has-images .icon-tile{width:58px;height:58px}.statement.has-images .icon-tile img{width:38px;height:38px}.statement.has-images .panel-title{font-size:34px}.statement.has-images .panel-definition{margin-top:14px;font-size:17px}.statement.has-images .point-list{margin-top:18px;column-gap:13px}.statement.has-images .point{padding-top:9px;font-size:12px}.statement.has-images .point:before{width:20px;height:2px;margin-bottom:6px}
    /* Template B — exact Template A structure with an inverted colour treatment for visual variety. */
    .evidence .body{display:grid;grid-template-columns:1fr}.evidence.has-images .body{grid-template-columns:minmax(0,1fr) minmax(300px,.56fr);gap:30px}.evidence .silver-panel{display:grid;grid-template-columns:minmax(0,1fr) 114px;grid-template-rows:1fr auto;height:100%;padding:42px 42px 30px;background:linear-gradient(112deg,rgba(29,58,120,.94),rgba(14,40,65,.82) 54%,rgba(255,255,255,.22));border-color:rgba(255,255,255,.88)}.evidence .panel-title{color:#fff;font-size:42px;font-weight:700;letter-spacing:-.045em;line-height:1.12}.evidence .panel-definition{margin-top:19px;color:rgba(255,255,255,.92);font-size:21px;line-height:1.35}.evidence .icon-tile{justify-self:end;background:linear-gradient(135deg,rgba(255,255,255,.94),var(--blue-accent));border-color:rgba(255,255,255,.9)}.evidence .point-list{grid-column:1/-1;grid-template-columns:repeat(var(--point-cols,3),minmax(0,1fr));column-gap:22px;margin-top:26px}.evidence .point{padding:13px 0 0;border-top:1px solid rgba(255,255,255,.38);border-bottom:0;color:#fff;font-size:15px;font-weight:600;line-height:1.28}.evidence .point:last-child{border-bottom:0}.evidence .point:before{content:"";display:block;width:28px;height:3px;margin-bottom:9px;background:var(--blue-accent)}.evidence.no-images.no-points .body{display:flex;align-items:center;justify-content:center}.evidence .empty-statement{width:min(890px,82%);height:auto;min-height:278px;grid-template-columns:minmax(0,1fr) 130px;padding:44px 48px}.evidence .empty-statement .panel-definition{max-width:630px}.evidence.has-images .silver-panel{grid-template-columns:minmax(0,1fr) 72px;padding:30px 30px 23px}.evidence.has-images .icon-tile{width:58px;height:58px}.evidence.has-images .icon-tile img{width:38px;height:38px}.evidence.has-images .panel-title{font-size:34px}.evidence.has-images .panel-definition{margin-top:14px;font-size:17px}.evidence.has-images .point-list{margin-top:18px;column-gap:13px}.evidence.has-images .point{padding-top:9px;font-size:12px}.evidence.has-images .point:before{width:20px;height:2px;margin-bottom:6px}.evidence .image-grid{background:linear-gradient(100deg,rgba(29,58,120,.3),rgba(255,255,255,.28));border-color:rgba(255,255,255,.9)}
    @media(max-width:700px){.controls span{display:none}.controls{gap:5px}.controls button{padding:6px 9px;font-size:12px}.slide{padding:10px 24px}.brand-header{min-height:58px;padding-top:8px}.context{max-width:68%;font-size:13px;line-height:18px}.brand-lockup{top:8px;right:-18px;transform:scale(.55);transform-origin:top right}.statement.has-images .body{gap:8px}.silver-panel{border-radius:7px}.statement .silver-panel{grid-template-columns:minmax(0,1fr) 34px;padding:15px 15px 10px}.statement.has-images .silver-panel{grid-template-columns:minmax(0,1fr) 26px;padding:11px 10px 8px}.icon-tile,.statement.has-images .icon-tile,.evidence.has-images .icon-tile{width:24px;height:24px;border-radius:4px}.icon-tile img,.statement.has-images .icon-tile img,.evidence.has-images .icon-tile img{width:16px;height:16px}.panel-title,.statement.has-images .panel-title,.evidence.has-images .panel-title{font-size:clamp(17px,3.2vw,25px)}.panel-definition,.statement.has-images .panel-definition,.evidence.has-images .panel-definition{margin-top:7px;font-size:8px}.point,.statement.has-images .point,.evidence .point{padding:4px 0;font-size:6px}.statement .point-list,.statement.has-images .point-list{column-gap:6px;margin-top:8px}.statement .point:before,.statement.has-images .point:before{width:12px;height:1px;margin-bottom:3px}.evidence .body{grid-template-rows:minmax(0,1.04fr) minmax(60px,.55fr);gap:6px}.evidence .intro,.evidence.has-images .intro{grid-template-columns:minmax(0,1fr) 28px;padding:11px 11px}.evidence.has-images .lower{grid-template-columns:minmax(68px,.73fr) minmax(0,1fr);gap:6px}.evidence .insights{padding:7px 9px}.image-grid{gap:3px;padding:3px;border-radius:7px}.footer{height:19px}.footer:before{top:5px}.page{top:0;font-size:8px}}
  </style>
</head>
<body>
  <div class="controls"><span>Concept template</span><button class="active" data-template="statement">Template A · Statement</button><button data-template="evidence">Template B · Inverted Statement</button><span>Images</span><button class="active" data-images="0">0</button><button data-images="1">1</button><button data-images="2">2</button><button data-images="3">3</button><span>Key points</span><button data-points="0">0</button><button data-points="1">1</button><button data-points="2">2</button><button class="active" data-points="3">3</button><button data-points="4">4</button><span>Point length</span><button class="active" data-length="short">Short</button><button data-length="long">20 words</button></div>
  <p class="caption" id="caption">Template A · 0 images · 3 key points</p>
  <div class="frame"><main class="slide statement no-images" id="slide"><header class="brand-header"><div class="context">How to Make Better Decisions</div><div class="brand-lockup"><div class="brand-name">PhillipCapital</div><div class="brand-tagline">Wealth. Across Chapters.</div></div></header><div class="body" id="body"></div><footer class="footer"><span class="page">02</span></footer></main></div>
  <script>
    const images=['images/course_1784265088_0/page_2_img_1_22.jpeg','images/course_1784265088_0/page_4_img_1_27.jpeg','images/course_1784269956_1/page_10_img_1_35.png'];
    const shortPoints=['Apply the idea to the decision in front of you.','Check the evidence before acting on an assumption.','Use the same principle consistently across similar cases.','Escalate when the available information is incomplete.'];
    const longPoints=['Use the principle to evaluate available evidence, identify material uncertainty, and make decisions that remain consistent with the organisation’s stated approach.','Test assumptions against relevant facts before acting, then document why the final choice is appropriate for the situation and available information.','Apply the same reasoning consistently across comparable cases while recognising when a meaningful difference requires escalation, additional evidence, or a different response.','Escalate early when essential facts are missing, conflicting, or unclear so that decisions remain explainable, accountable, and suitable for review.']; let template='statement',imageCount=0,pointCount=3,pointLength='short';
    const imageMarkup=()=>`<aside class="image-grid count-${imageCount}" aria-label="Course source images">${images.slice(0,imageCount).map(src=>`<div class="image"><img src="${src}" alt="Course source image"></div>`).join('')}</aside>`;
    const pointMarkup=()=>`<div class="point-list">${(pointLength==='long'?longPoints:shortPoints).slice(0,pointCount).map(p=>`<div class="point">${p}</div>`).join('')}</div>`;
    function renderStatement(){return `<section class="silver-panel ${pointCount?'':'no-points'} ${!pointCount&&!imageCount?'empty-statement':''}" style="--point-cols:${Math.max(pointCount,1)}"><div class="panel-copy"><div class="panel-title">Decision Quality</div><div class="panel-definition">Decision quality describes how well a choice is made by using relevant evidence, testing assumptions, and applying a clear and consistent process.</div></div><div class="icon-tile"><img src="brand/icon-10.svg" alt=""></div>${pointCount?pointMarkup():''}</section>${imageCount?imageMarkup():''}`}
    function renderEvidence(){return `<section class="silver-panel ${pointCount?'':'no-points'} ${!pointCount&&!imageCount?'empty-statement':''}" style="--point-cols:${Math.max(pointCount,1)}"><div class="panel-copy"><div class="panel-title">Decision Quality</div><div class="panel-definition">Decision quality describes how well a choice is made by using relevant evidence, testing assumptions, and applying a clear and consistent process.</div></div><div class="icon-tile"><img src="brand/icon-10.svg" alt=""></div>${pointCount?pointMarkup():''}</section>${imageCount?imageMarkup():''}`}
    function redraw(){const slide=document.querySelector('#slide'),body=document.querySelector('#body');slide.className=`slide ${template} ${imageCount?'has-images':'no-images'} ${pointCount?'has-points':'no-points'} points-${pointCount} ${pointLength==='long'?'long-points':''}`;body.innerHTML=template==='statement'?renderStatement():renderEvidence();document.querySelector('#caption').textContent=`Template ${template==='statement'?'A · Statement':'B · Inverted Statement'} · ${imageCount} image${imageCount===1?'':'s'} · ${pointCount} ${pointLength==='long'?'long ':' '}key point${pointCount===1?'':'s'}`;document.querySelectorAll('[data-template]').forEach(b=>b.classList.toggle('active',b.dataset.template===template));document.querySelectorAll('[data-images]').forEach(b=>b.classList.toggle('active',+b.dataset.images===imageCount));document.querySelectorAll('[data-points]').forEach(b=>b.classList.toggle('active',+b.dataset.points===pointCount));document.querySelectorAll('[data-length]').forEach(b=>b.classList.toggle('active',b.dataset.length===pointLength));}
    document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{template=b.dataset.template;redraw()});document.querySelectorAll('[data-images]').forEach(b=>b.onclick=()=>{imageCount=+b.dataset.images;redraw()});document.querySelectorAll('[data-points]').forEach(b=>b.onclick=()=>{pointCount=+b.dataset.points;redraw()});document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{pointLength=b.dataset.length;redraw()});redraw();
  </script>
</body>
</html>
