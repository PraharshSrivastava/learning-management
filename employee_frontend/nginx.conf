server {
    listen 8080;
    server_name _;
    client_max_body_size 200M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-LMS-App employee;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Keep video transfer out of the API workers and let Nginx satisfy native
    # HTTP byte-range requests used for startup and seeking.
    location ^~ /assets/videos/ {
        alias /srv/lms/videos/;
        sendfile on;
        tcp_nopush on;
        etag on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4 m4s;
        }
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, no-cache" always;
    }

    location /assets/ {
        try_files $uri $uri/ @backend_assets;
    }

    location @backend_assets {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
