services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${LMS_POSTGRES_DATA_DIR:-/opt/lms/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-lms}
      LMS_STORAGE_DIR: /app/storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemma-4-e4b}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-8128}
      TTS_ENDPOINT: ${TTS_ENDPOINT:?TTS_ENDPOINT is required}
      TTS_VOICE: ${TTS_VOICE:-sana}
      TTS_TEMPERATURE: ${TTS_TEMPERATURE:-0.6}
      TTS_SPEED: ${TTS_SPEED:-0.9}
      SLIDE_TRANSITION_PAUSE_SECONDS: ${SLIDE_TRANSITION_PAUSE_SECONDS:-1.0}
      COURSE_THUMBNAIL_ENDPOINT: ${COURSE_THUMBNAIL_ENDPOINT:?COURSE_THUMBNAIL_ENDPOINT is required}
      COURSE_THUMBNAIL_MODEL: ${COURSE_THUMBNAIL_MODEL:-ernie-image}
      COURSE_THUMBNAIL_API_KEY: ${COURSE_THUMBNAIL_API_KEY:-}
      COURSE_THUMBNAIL_CONNECT_TIMEOUT: ${COURSE_THUMBNAIL_CONNECT_TIMEOUT:-60}
      COURSE_THUMBNAIL_READ_TIMEOUT: ${COURSE_THUMBNAIL_READ_TIMEOUT:-180}
      COURSE_THUMBNAILS_ENABLED: ${COURSE_THUMBNAILS_ENABLED:-true}
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-1}
    volumes:
      - ${LMS_STORAGE_DIR:-/opt/lms/storage}:/app/storage
    ports:
      - "${BACKEND_PORT:-3060}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-6969}:80"
    depends_on:
      backend:
        condition: service_healthy

  employee_frontend:
    build:
      context: ./employee_frontend
      args:
        API_BASE_URL: ${EMPLOYEE_FRONTEND_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${EMPLOYEE_FRONTEND_PORT:-6970}:80"
    depends_on:
      backend:
        condition: service_healthy
