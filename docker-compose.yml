services:
  postgres:
    profiles: ["bundled-db"]
    image: postgres:16.15-trixie@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${LMS_POSTGRES_DATA_DIR:-/opt/lms/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LMS_STORAGE_DIR: /app/storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemma-4-e4b}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-100000}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-87000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-12000}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      LANGFUSE_CAPTURE_MAX_CHARS: ${LANGFUSE_CAPTURE_MAX_CHARS:-12000}
      LANGFUSE_TIMEOUT_SECONDS: ${LANGFUSE_TIMEOUT_SECONDS:-5}
      LIBREOFFICE_EXECUTABLE: ${LIBREOFFICE_EXECUTABLE:-soffice}
      DOCUMENT_CONVERSION_TIMEOUT_SECONDS: ${DOCUMENT_CONVERSION_TIMEOUT_SECONDS:-180}
      TTS_ENDPOINT: ${TTS_ENDPOINT:?TTS_ENDPOINT is required}
      TTS_VOICE: ${TTS_VOICE:-priyanka}
      TTS_TEMPERATURE: ${TTS_TEMPERATURE:-0.6}
      TTS_SPEED: ${TTS_SPEED:-0.9}
      SLIDE_TRANSITION_PAUSE_SECONDS: ${SLIDE_TRANSITION_PAUSE_SECONDS:-1.0}
      COURSE_THUMBNAIL_ENDPOINT: ${COURSE_THUMBNAIL_ENDPOINT:?COURSE_THUMBNAIL_ENDPOINT is required}
      COURSE_THUMBNAIL_MODEL: ${COURSE_THUMBNAIL_MODEL:-z-image-turbo}
      COURSE_THUMBNAIL_API_KEY: ${COURSE_THUMBNAIL_API_KEY:-}
      COURSE_THUMBNAIL_CONNECT_TIMEOUT: ${COURSE_THUMBNAIL_CONNECT_TIMEOUT:-60}
      COURSE_THUMBNAIL_READ_TIMEOUT: ${COURSE_THUMBNAIL_READ_TIMEOUT:-500}
      COURSE_THUMBNAILS_ENABLED: ${COURSE_THUMBNAILS_ENABLED:-true}
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-1}
      HUB_LAUNCH_SECRET: ${HUB_LAUNCH_SECRET:?HUB_LAUNCH_SECRET is required}
      HUB_TRAINER_APP_KEY: ${HUB_TRAINER_APP_KEY:-lms-trainer}
      HUB_EMPLOYEE_APP_KEY: ${HUB_EMPLOYEE_APP_KEY:-lms-employee}
      HUB_TRAINER_COOKIE_NAME: ${HUB_TRAINER_COOKIE_NAME:-lms_trainer_hub}
      HUB_EMPLOYEE_COOKIE_NAME: ${HUB_EMPLOYEE_COOKIE_NAME:-lms_employee_hub}
      HUB_LAUNCH_SESSION_SECONDS: ${HUB_LAUNCH_SESSION_SECONDS:-28800}
      HUB_LAUNCH_DEV_MODE: ${HUB_LAUNCH_DEV_MODE:-false}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-false}
      DIRECTORY_EXPORTS_BASE_URL: ${DIRECTORY_EXPORTS_BASE_URL:-}
      DIRECTORY_EXPORTS_API_KEY: ${DIRECTORY_EXPORTS_API_KEY:-}
      DIRECTORY_SYNC_ADMIN_KEY: ${DIRECTORY_SYNC_ADMIN_KEY:-}
      DIRECTORY_SYNC_TIMEOUT_SECONDS: ${DIRECTORY_SYNC_TIMEOUT_SECONDS:-30}
      DIRECTORY_SYNC_PAGE_LIMIT: ${DIRECTORY_SYNC_PAGE_LIMIT:-100}
      DIRECTORY_SYNC_ENABLED: ${DIRECTORY_SYNC_ENABLED:-true}
      DIRECTORY_SYNC_INTERVAL_HOURS: ${DIRECTORY_SYNC_INTERVAL_HOURS:-24}
      DIRECTORY_SYNC_INITIAL_DELAY_SECONDS: ${DIRECTORY_SYNC_INITIAL_DELAY_SECONDS:-0}
      DIRECTORY_SYNC_TIME: ${DIRECTORY_SYNC_TIME:-09:10}
      DIRECTORY_SYNC_TIMEZONE: ${DIRECTORY_SYNC_TIMEZONE:-Asia/Kolkata}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-disabled}
      EMAIL_SCHEDULER_ENABLED: ${EMAIL_SCHEDULER_ENABLED:-true}
      EMAIL_SCHEDULER_INTERVAL_SECONDS: ${EMAIL_SCHEDULER_INTERVAL_SECONDS:-300}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-25}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS:-300}
      EMAIL_LOCK_TIMEOUT_SECONDS: ${EMAIL_LOCK_TIMEOUT_SECONDS:-600}
      EMAIL_DUE_SOON_DAYS: ${EMAIL_DUE_SOON_DAYS:-2}
      EMAIL_ASSIGNMENT_REMINDER_DAYS: ${EMAIL_ASSIGNMENT_REMINDER_DAYS:-5}
      EMAIL_OVERDUE_REPEAT_DAYS: ${EMAIL_OVERDUE_REPEAT_DAYS:-2}
      EMAIL_NOTIFICATION_TIMEZONE: ${EMAIL_NOTIFICATION_TIMEZONE:-Asia/Kolkata}
      EMAIL_DIGEST_SEND_TIME: ${EMAIL_DIGEST_SEND_TIME:-09:00}
      EMAIL_DUE_SOON_DIGEST_INTERVAL_HOURS: ${EMAIL_DUE_SOON_DIGEST_INTERVAL_HOURS:-24}
      EMAIL_COMPLETION_DIGEST_INTERVAL_HOURS: ${EMAIL_COMPLETION_DIGEST_INTERVAL_HOURS:-24}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-false}
      EMAIL_TEST_ASSIGNMENT_REMINDER_MINUTES: ${EMAIL_TEST_ASSIGNMENT_REMINDER_MINUTES:-5}
      EMAIL_TEST_DUE_SOON_WINDOW_MINUTES: ${EMAIL_TEST_DUE_SOON_WINDOW_MINUTES:-7}
      EMAIL_TEST_OVERDUE_REPEAT_MINUTES: ${EMAIL_TEST_OVERDUE_REPEAT_MINUTES:-5}
      EMAIL_TEST_DIGEST_DELAY_MINUTES: ${EMAIL_TEST_DIGEST_DELAY_MINUTES:-1}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      EMAIL_RECIPIENT_ALLOWLIST: ${EMAIL_RECIPIENT_ALLOWLIST:-}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Learning Management System}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-30}
      LMS_PUBLIC_URL: ${LMS_PUBLIC_URL:-}
      LMS_EMPLOYEE_PUBLIC_URL: ${LMS_EMPLOYEE_PUBLIC_URL:-}
      LMS_TRAINER_PUBLIC_URL: ${LMS_TRAINER_PUBLIC_URL:-}
    volumes:
      - ${LMS_STORAGE_DIR:-/opt/lms/storage}:/app/storage
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3060}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
    restart: unless-stopped
    volumes:
      - ${LMS_STORAGE_DIR:-/opt/lms/storage}/generated/videos:/srv/lms/videos:ro
    ports:
      - "${FRONTEND_PORT:-6969}:8080"
    depends_on:
      backend:
        condition: service_healthy

  employee_frontend:
    build:
      context: ./employee_frontend
      args:
        API_BASE_URL: ${EMPLOYEE_FRONTEND_API_BASE_URL:-}
    restart: unless-stopped
    volumes:
      - ${LMS_STORAGE_DIR:-/opt/lms/storage}/generated/videos:/srv/lms/videos:ro
    ports:
      - "${EMPLOYEE_FRONTEND_PORT:-6970}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lms_postgres_data:
