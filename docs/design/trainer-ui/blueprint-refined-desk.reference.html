th:0}#pc-blueprint-desk input,#pc-blueprint-desk select,#pc-blueprint-desk textarea{display:block;width:100%;background:var(--pc-panel);color:var(--pc-text);border:1px solid var(--pc-border);border-radius:7px;padding:10px 11px;min-width:0;font-size:13px;font-weight:400}#pc-blueprint-desk textarea{resize:vertical;min-height:85px;line-height:1.55}#pc-blueprint-desk .pc-section{border:1px solid var(--pc-border);border-radius:9px;margin-bottom:17px;overflow:clip}#pc-blueprint-desk .pc-section-head{width:100%;border:0;border-radius:0;justify-content:flex-start;padding:13px 14px;font-size:14px;color:var(--pc-text)}#pc-blueprint-desk .pc-section-head span:first-of-type{flex:1;text-align:left}#pc-blueprint-desk .pc-section-content{padding:0 14px 15px}#pc-blueprint-desk .pc-details-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#pc-blueprint-desk .pc-wide{grid-column:1/-1}#pc-blueprint-desk .pc-module-titlebar{display:flex;align-items:center;gap:10px;margin:22px 0 12px}#pc-blueprint-desk .pc-module-titlebar h2{flex:1}#pc-blueprint-desk .pc-module-titlebar small{font-size:12px;color:var(--pc-muted);font-weight:400;margin-left:7px}#pc-blueprint-desk .pc-module{border:1px solid var(--pc-border);border-radius:9px;margin-bottom:10px;overflow:clip}#pc-blueprint-desk .pc-module-heading{display:flex;align-items:center;background:var(--pc-panel);padding-right:8px}#pc-blueprint-desk .pc-module.open .pc-module-heading{background:var(--pc-soft)}#pc-blueprint-desk .pc-module-toggle{flex:1;justify-content:flex-start;min-width:0;text-align:left;border:0;background:transparent;border-radius:0;padding:13px 12px;color:var(--pc-text);font-size:13px}#pc-blueprint-desk .pc-module-toggle .pc-module-name{flex:1;overflow-wrap:anywhere}#pc-blueprint-desk .pc-number{display:flex;align-items:center;justify-content:center;min-width:27px;height:27px;background:var(--pc-soft);color:var(--pc-blue);border-radius:50%;font-size:12px}#pc-blueprint-desk .pc-module-body{display:grid;gap:12px;padding:15px}#pc-blueprint-desk .pc-module-options{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}#pc-blueprint-desk .pc-module-options label{display:flex;align-items:center;gap:8px;font-size:12px}#pc-blueprint-desk .pc-module-options input{width:68px}#pc-blueprint-desk .pc-module-options small{font-size:11px;color:var(--pc-muted)}#pc-blueprint-desk .pc-images{display:grid;grid-template-columns:1fr 1fr;gap:14px}#pc-blueprint-desk .pc-image-card{border:1px solid var(--pc-border);border-radius:9px;overflow:clip}#pc-blueprint-desk .pc-art{min-height:120px;background:var(--pc-soft);display:flex;align-items:center;justify-content:center;gap:15px;padding:15px;color:var(--pc-blue)}#pc-blueprint-desk .pc-art>svg{width:45px;height:45px}#pc-blueprint-desk .pc-art-flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}#pc-blueprint-desk .pc-art-flow div{display:grid;justify-items:center;gap:8px;font-size:11px}#pc-blueprint-desk .pc-art-flow svg{width:24px;height:24px}#pc-blueprint-desk .pc-image-info{padding:12px;display:grid;gap:10px}#pc-blueprint-desk .pc-status{display:flex;align-items:center;gap:7px;color:var(--pc-green);font-size:12px;margin-top:18px}#pc-blueprint-desk .pc-status.dirty{color:var(--pc-amber)}#pc-blueprint-desk .pc-notice{display:flex;align-items:start;gap:9px;border-radius:8px;padding:12px 14px;background:var(--pc-soft);color:var(--pc-blue);font-size:12px;margin-bottom:15px}#pc-blueprint-desk .pc-notice.warn{background:var(--pc-amberbg);color:var(--pc-amber)}#pc-blueprint-desk .pc-notice.error{background:var(--pc-redbg);color:var(--pc-red)}#pc-blueprint-desk .pc-notice>span{flex:1}#pc-blueprint-desk .pc-notice button{padding:0;min-height:22px;border:0;color:inherit;background:transparent}#pc-blueprint-desk .pc-footer{font-size:11px;color:var(--pc-muted);padding:0 24px 18px}#pc-blueprint-desk .pc-modal-layer{position:absolute;inset:0;background:light-dark(#14223866,#0009);z-index:5;display:flex;justify-content:center;align-items:flex-start;padding:100px 20px 30px}#pc-blueprint-desk .pc-dialog{background:var(--pc-panel);border:1px solid var(--pc-border);border-radius:14px;padding:24px;max-width:470px;width:100%;box-shadow:0 12px 40px #0002}#pc-blueprint-desk .pc-dialog h2{margin-bottom:10px}#pc-blueprint-desk .pc-dialog p{color:var(--pc-muted);font-size:13px;margin-bottom:18px}#pc-blueprint-desk .pc-dialog .pc-toolbar{justify-content:flex-end;margin-top:20px}#pc-blueprint-desk .pc-empty{padding:40px 10px;text-align:center;color:var(--pc-muted)}#pc-blueprint-desk .pc-stage{padding:12px 0;display:flex;gap:12px;align-items:center;font-size:13px}#pc-blueprint-desk .pc-stage svg{color:var(--pc-green)}#pc-blueprint-desk [hidden]{display:none!important}

<script>
(()=>{
const root=document.getElementById('pc-blueprint-desk');
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const base=[{id:'service',name:'Customer Service Essentials',status:'draft',difficulty:'Beginner',language:'English',description:'Practical skills for clear, respectful customer conversations.',objective:'Listen, acknowledge concerns, explain next steps and follow up reliably.',audience:'New customer-facing employees',modules:[{id:'listen',title:'Listen actively',questions:3,content:'Start by understanding the customer’s concern. Ask an open question, listen without interrupting, and summarize what you heard. Confirm understanding before proposing a solution.'},{id:'empathy',title:'Respond with empathy',questions:3,content:'Acknowledge the concern in clear, respectful language. Recognize the customer’s perspective and avoid promises you cannot keep.'},{id:'explain',title:'Explain the next step',questions:3,content:'Explain the available next step and who will handle it. Check that the customer understands what will happen next.'},{id:'followup',title:'Follow up reliably',questions:3,content:'Agree on a realistic update time, record the next action, and follow up as agreed.'}],images:[{id:'conversation',caption:'Listen fully before proposing a solution.',module:'listen'},{id:'process',caption:'Listen, acknowledge, explain and follow up.',module:'followup'}]},
{id:'crm',name:'CRM User Guide',status:'active',difficulty:'Beginner',language:'English',description:'Use the CRM consistently in everyday customer work.',objective:'Find a customer record, add clear notes and record follow-up tasks.',audience:'Customer support employees',modules:[{id:'records',title:'Find customer records',questions:3,content:'Search for the customer record and confirm you have selected the right person before making changes.'},{id:'notes',title:'Record clear notes',questions:3,content:'Record the purpose of the interaction, agreed actions and the next follow-up date.'}],images:[]},
{id:'orientation',name:'Employee Orientation',status:'disabled',difficulty:'Beginner',language:'English',description:'An introduction to working with your team.',objective:'Locate learning resources and understand who to ask for help.',audience:'New employees',modules:[{id:'welcome',title:'Getting started',questions:3,content:'Meet your team and find the resources needed for your first week.'},{id:'support',title:'Finding support',questions:3,content:'Know the right team contact for practical questions and everyday support.'}],images:[]}];
let state={courses:clone(base),selected:'service',expanded:['listen'],details:true,images:false,filter:'all',notice:null,dialog:null,job:null},draft,saved;
let ownRevision='',noticeTimer,jobTimer;
const current=()=>state.courses.find(c=>c.id===state.selected);
function loadCourse(){draft=clone(current());saved=JSON.stringify(draft)}
loadCourse();
function restore(snapshot){const p=snapshot?.privateContent;if(!p||p.demo!=='blueprint-refined-desk'||p.revision===ownRevision||!Array.isArray(p.courses)||!p.courses.length)return;state.courses=clone(p.courses);state.selected=p.selected;state.expanded=p.expanded||[];state.details=p.details!==false;state.images=!!p.images;state.filter=p.filter||'all';if(!current())state.selected=state.courses[0].id;draft=p.draft?.id===state.selected?clone(p.draft):clone(current());saved=JSON.stringify(current());state.dialog=null;state.job=null;state.notice=null;}
restore(window.openai?.widgetState);
function persist(){ownRevision=String(Date.now())+Math.random();window.openai?.setWidgetState?.({modelContent:{demo:'Blueprint — Refined desk',course:draft?.name,screen:state.job?'generation':state.dialog?'confirmation':'blueprint',expandedModules:state.expanded,sourceImagesOpen:state.images,directAction:current()?.status==='draft'?'Delete':current()?.status==='active'?'Disable':'Enable',simulated:true},privateContent:{demo:'blueprint-refined-desk',revision:ownRevision,courses:state.courses,selected:state.selected,expanded:state.expanded,details:state.details,images:state.images,filter:state.filter,draft}})?.catch(()=>{});}
const dirty=()=>JSON.stringify(draft)!==saved;
function notify(text,type='info'){clearTimeout(noticeTimer);state.notice={text,type};render();noticeTimer=setTimeout(()=>{state.notice=null;render()},5000)}
function field(label,key,value,area=false,extra=''){return `<label class="pc-field">${label}${area?`<textarea data-field="${key}" ${extra}>${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}" ${extra}>`}</label>`}
function courseButtons(){return state.courses.filter(c=>state.filter==='all'||c.status===state.filter).map(c=>`<button type="button" class="pc-course cursor-interaction" data-course="${c.id}" aria-pressed="${c.id===state.selected}"><strong>${esc(c.id===state.selected?draft.name||'Untitled course':c.name)}</strong><span class="pc-course-meta"><span class="pc-badge ${c.status}">${c.status[0].toUpperCase()+c.status.slice(1)}</span><span>${c.modules.length} modules</span></span></button>`).join('')||'<p class="pc-sub">No courses in this view.</p>'}
function moduleCard(m,i){const open=state.expanded.includes(m.id);return `<section class="pc-module ${open?'open':''}" data-module="${m.id}"><div class="pc-module-heading"><button type="button" class="pc-module-toggle cursor-interaction" data-toggle="${m.id}" aria-expanded="${open}" aria-controls="pc-body-${m.id}"><span class="pc-number">${i+1}</span><span class="pc-module-name">${esc(m.title||'Untitled module')}</span>${icon(open?'chevron-up':'chevron-down')}</button><button type="button" class="pc-quiet pc-danger cursor-interaction" data-remove="${m.id}" aria-label="Remove module ${i+1}">${icon('trash-2')}</button></div><div class="pc-module-body" id="pc-body-${m.id}" ${open?'':'hidden'}>${field('Module title','title',m.title,false,`data-mid="${m.id}"`)}<div class="pc-module-options"><label>Quiz questions <input type="number" min="0" max="20" data-field="questions" data-mid="${m.id}" value="${m.questions}" aria-label="Module ${i+1} quiz questions"></label><small>Use 0 to disable the module quiz.</small></div>${field('Module content','content',m.content,true,`data-mid="${m.id}" rows="4"`)}<div class="pc-module-options"><small>${draft.images.filter(img=>img.module===m.id).length} source images assigned</small><div class="pc-toolbar"><button type="button" class="pc-quiet cursor-interaction" data-move="${m.id}" data-direction="up" ${i===0?'disabled':''}>${icon('arrow-up')}Move up</button><button type="button" class="pc-quiet cursor-interaction" data-move="${m.id}" data-direction="down" ${i===draft.modules.length-1?'disabled':''}>${icon('arrow-down')}Move down</button></div></div></div></section>`}
function sourceImages(){return draft.images.length?`<div class="pc-images">${draft.images.map(img=>`<div class="pc-image-card"><div class="pc-art" role="img" aria-label="${img.id==='conversation'?'Sample customer conversation illustration':'Sample four-step service process'}">${img.id==='conversation'?`${icon('user-round')}${icon('messages-square')}${icon('user-round')}`:`<div class="pc-art-flow">${[['ear','Listen'],['handshake','Acknowledge'],['list-checks','Explain'],['calendar-check','Follow up']].map(([n,t])=>`<div>${icon(n)}<span>${t}</span></div>`).join('')}</div>`}</div><div class="pc-image-info">${field('Caption','caption',img.caption,false,`data-image="${img.id}"`)}<label class="pc-field">Assigned module<select data-field="module" data-image="${img.id}"><option value="">Unassigned</option>${draft.modules.map((m,i)=>`<option value="${m.id}" ${m.id===img.module?'selected':''}>${i+1}. ${esc(m.title||'Untitled module')}</option>`).join('')}</select></label></div></div>`).join('')}</div>`:'<p class="pc-sub">No source images in this course.</p>'}
function statusMarkup(){return `<span class="pc-status ${dirty()?'dirty':''}">${icon(dirty()?'circle-alert':'circle-check')}<span>${dirty()?'Unsaved changes':'All changes saved'}</span></span>`}
function render(){const c=current();if(!c){root.innerHTML='<p class="pc-empty">No sample courses remain. Reopen this demo to start again.</p>';return}const action=c.status==='draft'?'Delete':c.status==='active'?'Disable':'Enable';root.innerHTML=`<header class="pc-top"><span class="pc-brand">PhillipCapital</span><nav aria-label="Trainer navigation">${['Documents','Blueprint','Courses','Assign','Performance'].map(n=>`<button type="button" class="cursor-interaction" data-nav="${n}" ${n==='Blueprint'?'aria-current="page"':''}>${n}</button>`).join('')}</nav></header><div class="pc-layout"><aside class="pc-sidebar"><h2>My courses</h2><label for="pc-course-filter">Course status</label><select id="pc-course-filter"><option value="all">All courses</option>${['draft','active','disabled'].map(s=>`<option value="${s}" ${state.filter===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select><div class="pc-courses">${courseButtons()}</div></aside><main class="pc-main"><div class="pc-heading"><div><h1>Course blueprint</h1><p class="pc-sub">Review your outline before generating videos and quizzes.</p></div><div class="pc-toolbar"><button type="button" class="pc-quiet ${action==='Delete'?'pc-danger':''} cursor-interaction" data-action="lifecycle">${icon(action==='Delete'?'trash-2':action==='Disable'?'circle-pause':'circle-play')}${action}</button><button type="button" class="pc-quiet cursor-interaction" data-action="reset" ${!dirty()?'disabled':''}>${icon('rotate-ccw')}Reset</button><button type="button" class="cursor-interaction" data-action="save" ${!dirty()?'disabled':''}>${icon('save')}Save changes</button><button type="button" class="pc-primary cursor-interaction" data-action="generate">${icon('play')}Generate course</button></div></div>${state.notice?`<div class="pc-notice ${state.notice.type==='error'?'error':state.notice.type==='warn'?'warn':''}" role="${state.notice.type==='error'?'alert':'status'}">${icon(state.notice.type==='error'?'circle-alert':'info')}<span>${esc(state.notice.text)}</span><button type="button" data-action="dismiss" class="cursor-interaction" aria-label="Dismiss notification">${icon('x')}</button></div>`:''}<div class="pc-fields">${field('Course title','name',draft.name)}<label class="pc-field">Difficulty<select data-field="difficulty">${['Beginner','Easy','Intermediate','Advanced'].map(x=>`<option ${x===draft.difficulty?'selected':''}>${x}</option>`).join('')}</select></label>${field('Language','language',draft.language)}</div><section class="pc-section"><button type="button" class="pc-section-head cursor-interaction" data-action="details" aria-expanded="${state.details}" aria-controls="pc-course-details">${icon('info')}<span>Course details</span><span class="pc-badge ${c.status}">${c.status[0].toUpperCase()+c.status.slice(1)}</span>${icon(state.details?'chevron-up':'chevron-down')}</button><div id="pc-course-details" class="pc-section-content" ${state.details?'':'hidden'}><div class="pc-details-grid">${field('Description','description',draft.description,true)}${field('Learning goals','objective',draft.objective,true)}<div class="pc-wide">${field('Audience','audience',draft.audience)}</div></div></div></section><div class="pc-module-titlebar">${icon('layers')}<h2>Modules <small>${draft.modules.length} modules</small></h2><button type="button" data-action="add" class="cursor-interaction">${icon('plus')}Add module</button></div><div id="pc-module-list">${draft.modules.map(moduleCard).join('')||'<p class="pc-sub">Add a module to begin.</p>'}</div><section class="pc-section" style="margin-top:18px"><button type="button" class="pc-section-head cursor-interaction" data-action="images" aria-expanded="${state.images}" aria-controls="pc-source-images">${icon('images')}<span>Source images <small class="pc-sub">${draft.images.length} images</small></span>${icon(state.images?'chevron-up':'chevron-down')}</button><div class="pc-section-content" id="pc-source-images" ${state.images?'':'hidden'}>${sourceImages()}</div></section><div id="pc-saved-status" aria-live="polite">${statusMarkup()}</div></main></div><footer class="pc-footer">Interactive design demo · Changes stay in this preview · AI, image samples and course generation are simulated.</footer>${dialogMarkup()}`;root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});if(state.dialog){root.querySelector('.pc-dialog button')?.focus();}}
function dialogMarkup(){const d=state.dialog;if(!d)return '';let body='',buttons='';if(d.type==='switch'){body=`<h2 id="pc-dialog-title">Save your changes?</h2><p>You have unsaved changes in ${esc(draft.name||'this course')}. Choose what to do before switching courses.</p>`;buttons='<button data-confirm="cancel">Stay here</button><button data-confirm="discard">Discard and switch</button><button data-confirm="save-switch" class="pc-primary">Save and switch</button>'}else if(d.type==='reset'){body='<h2 id="pc-dialog-title">Discard unsaved changes?</h2><p>This restores the last saved blueprint in this preview.</p>';buttons='<button data-confirm="cancel">Keep editing</button><button data-confirm="reset">Discard changes</button>'}else if(d.type==='remove'){body=`<h2 id="pc-dialog-title">Remove this module?</h2><p>${esc(draft.modules.find(m=>m.id===d.id)?.title)} will be removed from this blueprint. Its source images will become unassigned.</p>`;buttons='<button data-confirm="cancel">Cancel</button><button data-confirm="remove" class="pc-danger">Remove module</button>'}else if(d.type==='Delete'||d.type==='Disable'){body=`<h2 id="pc-dialog-title">${d.type} course?</h2><p>${d.type==='Delete'?'This removes the selected sample draft from this preview.':'This marks the sample course as disabled. Production will retain its existing impact checks and confirmation.'}</p><p>${esc(draft.name)}</p>`;buttons=`<button data-confirm="cancel">Cancel</button><button data-confirm="lifecycle" class="pc-danger">${d.type} course</button>`}else if(d.type==='Enable'){body='<h2 id="pc-dialog-title">Continue to Assign</h2><p>Enable keeps the existing assignment workflow. In the application, this opens Assign for the selected course.</p>';buttons='<button data-confirm="cancel">Back to Blueprint</button>'}else if(d.type==='generate'){body=`<h2 id="pc-dialog-title">Generate this course?</h2><p>${esc(draft.name)} · ${draft.modules.length} modules · ${draft.modules.reduce((s,m)=>s+Number(m.questions),0)} quiz questions</p><p>Videos and quizzes will use the saved blueprint. This preview simulates the generation stages.</p>`;buttons='<button data-confirm="cancel">Review blueprint</button><button data-confirm="start" class="pc-primary">Start demo generation</button>'}else if(d.type==='job'){body=`<h2 id="pc-dialog-title">${state.job==='complete'?'Course preview ready':'Generating course preview'}</h2><p>Simulated output — no model or video service is called.</p>${['Preparing saved blueprint','Creating lesson slides and narration','Assembling videos and quizzes'].map((t,i)=>`<div class="pc-stage">${icon(state.job==='complete'||i<state.job?'circle-check':i===state.job?'loader-circle':'circle')}<span>${t}</span></div>`).join('')}`;buttons=state.job==='complete'?'<button data-confirm="cancel" class="pc-primary">Back to Blueprint</button>':'<button data-confirm="stop">Stop demo</button>'}return `<div class="pc-modal-layer"><section role="dialog" aria-modal="true" aria-labelledby="pc-dialog-title" class="pc-dialog">${body}<div class="pc-toolbar">${buttons}</div></section></div>`}
function validate(){if(!draft.name.trim())return 'Enter a course title before continuing.';if(!draft.language.trim())return 'Enter the course language.';if(!draft.modules.length)return 'Add at least one module before continuing.';for(let i=0;i<draft.modules.length;i++){const m=draft.modules[i];if(!m.title.trim()||!m.content.trim())return `Complete the title and content for module ${i+1}.`;if(!Number.isInteger(Number(m.questions))||m.questions===''||Number(m.questions)<0||Number(m.questions)>20)return `Use a whole question count from 0 to 20 for module ${i+1}.`;}return ''}
function save(){const error=validate();if(error){state.dialog=null;notify(error,'error');return false}state.courses=state.courses.map(c=>c.id===state.selected?clone(draft):c);saved=JSON.stringify(draft);return true}
function go(id){state.selected=id;loadCourse();state.expanded=[draft.modules[0]?.id].filter(Boolean);state.dialog=null;state.notice=null;render();persist()}
root.addEventListener('input',e=>{const el=e.target;if(!el.dataset.field)return;const {field,mid,image}=el.dataset;if(mid){draft.modules.find(m=>m.id===mid)[field]=field==='questions'?(el.value===''?'':Number(el.value)):el.value}else if(image){draft.images.find(i=>i.id===image)[field]=el.value}else draft[field]=el.value;root.querySelector('#pc-saved-status').innerHTML=statusMarkup();root.querySelector('[data-action="save"]').disabled=!dirty();root.querySelector('[data-action="reset"]').disabled=!dirty();if(mid&&field==='title')root.querySelector(`[data-toggle="${mid}"] .pc-module-name`).textContent=el.value||'Untitled module';persist()});
root.addEventListener('change',e=>{if(e.target.id==='pc-course-filter'){state.filter=e.target.value;render();persist()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.nav){if(d.nav!=='Blueprint')notify(`${d.nav} will keep its existing navigation in the application. This preview focuses on Blueprint.`);return}if(d.course){if(d.course===state.selected)return;if(dirty()){state.dialog={type:'switch',id:d.course};render()}else go(d.course);return}if(d.toggle){state.expanded=state.expanded.includes(d.toggle)?state.expanded.filter(id=>id!==d.toggle):[...state.expanded,d.toggle];render();persist();return}if(d.remove){state.dialog={type:'remove',id:d.remove};render();return}if(d.move){const i=draft.modules.findIndex(m=>m.id===d.move),j=i+(d.direction==='up'?-1:1);if(j>=0&&j<draft.modules.length)[draft.modules[i],draft.modules[j]]=[draft.modules[j],draft.modules[i]];render();persist();return}if(d.confirm){const dialog=state.dialog;if(d.confirm==='cancel'){state.dialog=null;state.job=null;clearTimeout(jobTimer)}if(d.confirm==='discard')return go(dialog.id);if(d.confirm==='save-switch'){if(save())go(dialog.id);return}if(d.confirm==='reset'){draft=clone(current());state.expanded=[draft.modules[0]?.id].filter(Boolean);state.dialog=null}if(d.confirm==='remove'){draft.modules=draft.modules.filter(m=>m.id!==dialog.id);draft.images.forEach(i=>{if(i.module===dialog.id)i.module=''});state.dialog=null}if(d.confirm==='lifecycle'){if(dialog.type==='Delete'){state.courses=state.courses.filter(c=>c.id!==state.selected);if(state.courses.length)return go(state.courses[0].id)}else{draft.status='disabled';state.courses=state.courses.map(c=>c.id===state.selected?clone(draft):c);saved=JSON.stringify(draft)}state.dialog=null}if(d.confirm==='start'){state.dialog={type:'job'};state.job=0;runJob()}if(d.confirm==='stop'){clearTimeout(jobTimer);state.dialog=null;state.job=null}render();persist();return}switch(d.action){case'details':state.details=!state.details;break;case'images':state.images=!state.images;break;case'dismiss':state.notice=null;break;case'reset':state.dialog={type:'reset'};break;case'save':if(save())notify('Blueprint saved in this preview.');persist();return;case'add':{const m={id:'m'+Date.now(),title:'New module',content:'',questions:3};draft.modules.push(m);state.expanded.push(m.id);render();root.querySelector(`[data-mid="${m.id}"][data-field="title"]`)?.focus();persist();return}case'lifecycle':state.dialog={type:current().status==='draft'?'Delete':current().status==='active'?'Disable':'Enable'};break;case'generate':if(dirty()){notify('Save your changes before generating the course.','warn');return}if(validate()){notify(validate(),'error');return}state.dialog={type:'generate'};break;default:return}render();persist()});
function runJob(){jobTimer=setTimeout(()=>{if(state.dialog?.type!=='job')return;state.job=state.job===2?'complete':state.job+1;render();persist();if(state.job!=='complete')runJob()},1300)}
root.addEventListener('keydown',e=>{if(!state.dialog)return;if(e.key==='Escape'){clearTimeout(jobTimer);state.dialog=null;state.job=null;render();return}if(e.key==='Tab'){const els=[...root.querySelectorAll('.pc-dialog button:not(:disabled)')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(s?.privateContent?.revision===ownRevision)return;if(s?.privateContent?.demo==='blueprint-refined-desk'){restore(s);render()}});
render();
})();
</script>
