<script>
(()=>{
const people=[['ananya','Ananya Rao','Customer Support'],['rohan','Rohan Patel','Customer Support'],['neha','Neha Sharma','Customer Support'],['priya','Priya Shah','Customer Support'],['rahul','Rahul Mehta','Sales'],['amit','Amit Desai','Sales'],['sana','Sana Khan','Operations'],['meera','Meera Iyer','Leadership']].map(([id,name,dept])=>({id,name,dept}));
const courses=[{id:'service',name:'Customer Service Essentials',status:'active',modules:4},{id:'crm',name:'CRM User Guide',status:'draft',modules:2},{id:'orientation',name:'Employee Orientation',status:'disabled',modules:2}];
const copy=x=>JSON.parse(JSON.stringify(x)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const initialRule=()=>({all:false,depts:['Customer Support'],excludes:['priya'],mode:'relative',days:7,date:'2026-10-30'});
const initial=()=>({selected:'service',courseStates:Object.fromEntries(courses.map(c=>[c.id,c.status])),rule:initialRule(),savedRule:initialRule(),observers:[{person:'meera',dept:'Customer Support'}],savedObservers:[{person:'meera',dept:'Customer Support'}],assigned:['ananya','rohan','neha','priya'],tab:'employees',observersOpen:true,view:'matching',search:'',page:1,notice:null,dialog:null});
const states={focused:initial(),review:initial()},roots={focused:document.getElementById('pc-assign-sidebar-app')};let revision='',timers={};
const find=id=>people.find(p=>p.id===id);const status=s=>s.courseStates[s.selected];const dirty=s=>JSON.stringify(s.rule)!==JSON.stringify(s.savedRule);const observerDirty=s=>JSON.stringify(s.observers)!==JSON.stringify(s.savedObservers);const matches=s=>people.filter(p=>(s.rule.all||s.rule.depts.includes(p.dept))&&!s.rule.excludes.includes(p.id));const conflicts=s=>matches(s).filter(p=>s.savedObservers.some(o=>o.person===p.id));const due=s=>s.rule.mode==='relative'?`${s.rule.days} days after assignment`:`${s.rule.date||'Choose date'} · Asia/Kolkata`;
function restore(x){const p=x?.privateContent;if(p?.demo!=='assign-focused-sidebar'||p.revision===revision)return;for(const k of Object.keys(roots))if(p.states?.[k]?.rule){states[k]={...initial(),...p.states[k],notice:null,dialog:null};render(k)}}
function persist(k){revision=String(Date.now())+Math.random();window.openai?.setWidgetState?.({modelContent:{demo:'Focused assignment with course sidebar',design:k==='focused'?'Focused assignment':'Review desk',course:courses.find(c=>c.id===states[k].selected).name,matchingEmployees:matches(states[k]).length,deadline:due(states[k]),tab:states[k].tab,simulated:true},privateContent:{demo:'assign-focused-sidebar',revision,states:Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{...s,notice:null,dialog:null}]))}})?.catch(()=>{})}
function notice(k,text,type='info'){const s=states[k];clearTimeout(timers[k]);s.notice={text,type};render(k);timers[k]=setTimeout(()=>{s.notice=null;render(k)},5000)}
function header(){return `<header class="ad-header"><span class="ad-brand">PhillipCapital</span><nav class="ad-nav" aria-label="Trainer navigation">${['Documents','Blueprint','Courses','Assign','Performance'].map(n=>`<button type="button" data-nav="${n}" ${n==='Assign'?'aria-current="page"':''}>${n}</button>`).join('')}</nav></header>`}
function lifecycle(s){const st=status(s);return st==='disabled'?'':`<button type="button" class="ad-quiet ${st==='draft'?'ad-danger':''}" data-action="lifecycle">${icon(st==='draft'?'trash-2':'circle-pause')}${st==='draft'?'Delete':'Disable'}</button>`}
function publishText(s){return status(s)==='active'?'Update assignments':status(s)==='disabled'?'Enable':'Publish & assign'}
function employeePanel(s){return `<section class="ad-panel"><div class="ad-title">${icon('users')}<h2>Target employees</h2></div><p class="ad-muted">Choose who should receive this course.</p><label class="ad-check"><input type="checkbox" data-field="all" ${s.rule.all?'checked':''}>All active employees</label>${s.rule.all?'':`<div class="ad-rule"><label>Include groups</label><div class="ad-chips">${s.rule.depts.map(d=>`<span class="ad-chip">${esc(d)}<button type="button" data-remove-dept="${esc(d)}" aria-label="Remove ${esc(d)} group">${icon('x')}</button></span>`).join('')}<button type="button" data-action="groups">${icon('plus')}Add group</button></div></div>`}<hr class="ad-separator"><div class="ad-rule"><label>Employee exclusions</label><span class="ad-muted">Excluded employees will not receive this assignment.</span><div class="ad-chips">${s.rule.excludes.map(id=>`<span class="ad-chip">${esc(find(id).name)}<button type="button" data-unexclude="${id}" aria-label="Remove exclusion for ${esc(find(id).name)}">${icon('x')}</button></span>`).join('')}<button type="button" data-action="exclusions">${icon('user-minus')}Add exclusion</button></div></div></section>`}
function deadlinePanel(s){return `<section class="ad-panel"><div class="ad-title">${icon('calendar-days')}<h2>Completion deadline</h2></div><div class="ad-segment"><button type="button" data-mode="relative" aria-pressed="${s.rule.mode==='relative'}">Days after assignment</button><button type="button" data-mode="fixed" aria-pressed="${s.rule.mode==='fixed'}">Specific date</button></div>${s.rule.mode==='relative'?`<label class="ad-field">Due within (days)<input type="number" min="1" max="365" data-field="days" value="${esc(s.rule.days)}"></label><p class="ad-muted" style="margin-top:10px">Calculated from each employee’s assignment date.</p>`:`<label class="ad-field">Completion date<input type="date" min="2026-10-23" data-field="date" value="${esc(s.rule.date)}"></label><p class="ad-muted" style="margin-top:10px">Due by the end of this date (Asia/Kolkata).</p>`}</section>`}
function observerBody(s){return `<div class="ad-note">${icon('shield-check')}<span>Observers can view performance only. They are not enrolled as learners.</span></div>${s.observers.map((o,i)=>`<div class="ad-observer-row"><label class="ad-field">Observer<select data-observer="${i}" data-kind="person">${people.map(p=>`<option value="${p.id}" ${p.id===o.person?'selected':''}>${p.name}</option>`).join('')}</select></label><label class="ad-field">Performance scope<select data-observer="${i}" data-kind="dept">${['Customer Support','Sales','Operations','Leadership'].map(d=>`<option ${d===o.dept?'selected':''}>${d}</option>`).join('')}</select></label><div class="ad-actions"><button type="button" class="ad-quiet ad-danger" data-remove-observer="${i}">${icon('trash-2')}Remove observer</button></div></div>`).join('')||'<p class="ad-muted">No observers selected.</p>'}<div class="ad-actions"><button type="button" data-action="add-observer">${icon('user-plus')}Add observer</button><button type="button" data-action="save-observers" ${!observerDirty(s)?'disabled':''}>${icon('save')}Save observers</button><button type="button" data-action="apply-observers" ${observerDirty(s)||status(s)!=='active'?'disabled':''}>${icon('shield-check')}Apply observers</button></div><p class="ad-muted" style="margin:12px 0 0">${observerDirty(s)?'Save observer selections before applying access.':status(s)!=='active'?'Publish and assign the course before applying observers.':'Observer selections saved. Apply access separately.'}</p>`}
function observersPanel(s,collapsible=false){return `<section class="ad-panel">${collapsible?`<button type="button" class="ad-observer-bar" data-action="toggle-observers" aria-expanded="${s.observersOpen}">${icon('shield-check')}<span>Performance observers <span class="ad-muted">· ${s.observers.length} selected</span></span>${icon(s.observersOpen?'chevron-up':'chevron-down')}</button><div class="ad-observer-body" ${s.observersOpen?'':'hidden'}>${observerBody(s)}</div>`:`<div class="ad-title">${icon('shield-check')}<h2>Performance observers</h2></div>${observerBody(s)}`}</section>`}
function previewPanel(s){const list=(s.view==='matching'?matches(s):people.filter(p=>s.assigned.includes(p.id))).filter(p=>(p.name+' '+p.dept).toLowerCase().includes(s.search.toLowerCase()));const max=Math.max(1,Math.ceil(list.length/3));s.page=Math.min(s.page,max);const slice=list.slice((s.page-1)*3,s.page*3);return `<section class="ad-panel ad-preview"><div class="ad-title">${icon('clipboard-list')}<h2>Assignment preview</h2></div><div class="ad-preview-controls"><button type="button" data-view="matching" aria-pressed="${s.view==='matching'}">Matching (${matches(s).length})</button><button type="button" data-view="assigned" aria-pressed="${s.view==='assigned'}">Assigned (${s.assigned.length})</button></div><input type="search" data-field="search" value="${esc(s.search)}" aria-label="Search employees" placeholder="Search employees"><div class="ad-preview-results">${previewResults(s,list,slice,max)}</div></section>`}
function previewResults(s,list,slice,max){return `<table class="ad-table"><thead><tr><th>Employee</th><th>Department</th><th>Status</th></tr></thead><tbody>${slice.map(p=>`<tr><td>${p.name}</td><td>${p.dept}</td><td><span class="ad-badge">${s.view==='assigned'?'Assigned':'Matching'}</span></td></tr>`).join('')||'<tr><td colspan="3">No employees match this view.</td></tr>'}</tbody></table><div class="ad-page"><span>${list.length?`Showing ${(s.page-1)*3+1}–${Math.min(s.page*3,list.length)} of ${list.length}`:'0 employees'}</span><div class="ad-actions"><button type="button" data-page="prev" ${s.page<=1?'disabled':''} aria-label="Previous employee page">${icon('chevron-left')}</button><span>${s.page} / ${max}</span><button type="button" data-page="next" ${s.page>=max?'disabled':''} aria-label="Next employee page">${icon('chevron-right')}</button></div></div>`}
function summary(s){return `<aside class="ad-panel ad-summary"><h2>Assignment review</h2><div class="ad-summary-item">${icon('users')}<div><span class="ad-match-count">${matches(s).length}</span> matching employees<small>After inclusions and exclusions</small></div></div><div class="ad-summary-item">${icon('calendar-days')}<div class="ad-due-summary">${esc(due(s))}</div></div><div class="ad-summary-item">${icon('shield-check')}<div>${s.observers.length} observers selected<small>Apply observer access separately</small></div></div><div class="ad-actions"><button type="button" data-action="publish" class="ad-primary">${icon('send')}${status(s)==='active'?'Review and update':publishText(s)}</button></div><p class="ad-muted">Review the employee list and deadline before applying changes.</p></aside>`}
function render(k){const root=roots[k],s=states[k],c=courses.find(c=>c.id===s.selected),review=k==='review';root.innerHTML=`${header()}<div class="ad-layout">${true?`<aside class="ad-sidebar"><h2>Assignable courses</h2>${courses.map(c=>`<button type="button" data-course="${c.id}" aria-pressed="${s.selected===c.id}">${c.name}<small>${s.courseStates[c.id]} · ${c.modules} modules</small></button>`).join('')}</aside>`:''}<main class="ad-main"><div class="ad-heading"><div><h1>Assign course</h1><p class="ad-muted">${esc(c.name)}</p></div><div class="ad-actions">${lifecycle(s)}<button type="button" data-action="save-rule" ${!dirty(s)?'disabled':''}>${icon('save')}Save rule</button><button type="button" data-action="refresh">${icon('refresh-cw')}Refresh</button>${review?'':`<button type="button" data-action="publish" class="ad-primary">${icon('send')}${publishText(s)}</button>`}</div></div>${false?`<div class="ad-course-select"><label>Course<select data-field="course">${courses.map(x=>`<option value="${x.id}" ${x.id===s.selected?'selected':''}>${x.name}</option>`).join('')}</select></label><span class="ad-badge ${status(s)==='active'?'active':''}">${status(s)}</span></div>`:''}<div class="ad-notices">${s.notice?`<div class="ad-note ${s.notice.type}" role="${s.notice.type==='error'?'alert':'status'}">${icon(s.notice.type==='error'?'circle-alert':'info')}<span>${esc(s.notice.text)}</span><button type="button" data-action="dismiss" aria-label="Dismiss notification">${icon('x')}</button></div>`:''}${conflicts(s).length?`<div class="ad-note warn">${icon('triangle-alert')}<span>${conflicts(s).length} matching employee is also a saved observer. Exclude them or change and save observer selections before publishing.</span></div>`:''}</div>${review?`<div class="ad-tabs" role="tablist" aria-label="Assignment settings">${[['employees','users','Employees'],['deadline','calendar-days','Deadline'],['observers','shield-check','Observers']].map(([id,i,t])=>`<button type="button" role="tab" id="ad-${k}-tab-${id}" aria-controls="ad-${k}-panel" data-tab="${id}" aria-selected="${s.tab===id}">${icon(i)}${t}</button>`).join('')}</div><div class="ad-grid"><div class="ad-column" role="tabpanel" id="ad-${k}-panel" aria-labelledby="ad-${k}-tab-${s.tab}">${s.tab==='employees'?employeePanel(s)+previewPanel(s):s.tab==='deadline'?deadlinePanel(s):observersPanel(s)}</div>${summary(s)}</div>`:`<div class="ad-grid"><div class="ad-column">${employeePanel(s)}${previewPanel(s)}</div><div class="ad-column">${deadlinePanel(s)}${observersPanel(s,false)}</div></div>`}<div class="ad-status ${dirty(s)?'dirty':''}" aria-live="polite">${icon(dirty(s)?'circle-alert':'circle-check')}<span>${dirty(s)?'Unsaved employee rule changes':'Employee rule saved'}</span></div><p class="ad-muted">Existing progress and completed results are retained. Observer access is applied separately.</p></main></div><footer class="ad-footer">Interactive design preview · Sample employees only · Saving, assignment and observer access are simulated.</footer>${modal(s,k)}`;root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});if(s.dialog)root.querySelector('.ad-dialog button')?.focus()}
function modal(s,k){const d=s.dialog;if(!d)return '';let title='',body='',buttons='';if(d.type==='groups'||d.type==='exclusions'){title=d.type==='groups'?'Include employee groups':'Exclude employees';body=(d.type==='groups'?['Customer Support','Sales','Operations','Leadership']:people).map(p=>{const id=typeof p==='string'?p:p.id,label=typeof p==='string'?p:p.name;return `<label class="ad-check"><input type="checkbox" data-pick="${esc(id)}" ${d.picks.includes(id)?'checked':''}>${esc(label)}</label>`}).join('');buttons='<button data-confirm="cancel">Cancel</button><button class="ad-primary" data-confirm="picks">Apply selection</button>'}else if(d.type==='publish'){title=publishText(s)+'?';body=`<p>${matches(s).length} employees match this selection.</p><div class="ad-note">${icon('calendar-days')}<span>${esc(due(s))}</span></div><p>Excluded employees lose access. Completed results and existing progress are retained. Observer access must be applied separately.</p>`;buttons=`<button data-confirm="cancel">Keep reviewing</button><button class="ad-primary" data-confirm="publish">${icon('send')}${publishText(s)}</button>`}else if(d.type==='switch'){title='Save your employee rule?';body='<p>Switching courses would discard unsaved employee or observer edits. Stay here to save them, or discard and switch.</p>';buttons='<button data-confirm="cancel">Stay here</button><button data-confirm="switch">Discard and switch</button>'}else if(d.type==='disable'||d.type==='delete'){title=d.type==='disable'?'Disable course?':'Delete sample draft?';body='<p>This changes the selected sample course only. Production will retain its existing impact checks and confirmation.</p>';buttons=`<button data-confirm="cancel">Cancel</button><button class="ad-danger" data-confirm="lifecycle">${d.type==='disable'?'Disable':'Delete'} course</button>`}else if(d.type==='apply-observers'){title='Apply observer access?';body=`<p>${s.savedObservers.length} saved observers will receive performance access for their selected scopes. They will not be enrolled as learners.</p>`;buttons='<button data-confirm="cancel">Cancel</button><button class="ad-primary" data-confirm="apply-observers">Apply observers</button>'}return `<div class="ad-modal"><section class="ad-dialog" role="dialog" aria-modal="true" aria-labelledby="ad-dialog-${k}"><h2 id="ad-dialog-${k}">${title}</h2>${body}<div class="ad-actions">${buttons}</div></section></div>`}
function validation(s){if(!matches(s).length)return 'Select at least one matching employee.';if(conflicts(s).length)return 'Resolve the employee and observer conflict before publishing.';if(s.rule.mode==='relative'&&(!Number.isInteger(Number(s.rule.days))||Number(s.rule.days)<1||Number(s.rule.days)>365))return 'Enter a whole number of days from 1 to 365 for this demo.';if(s.rule.mode==='fixed'&&(!s.rule.date||s.rule.date<'2026-10-23'))return 'Choose a future completion date.';return ''}
function switchCourse(k,id){const s=states[k];s.selected=id;s.rule=initialRule();s.savedRule=initialRule();s.observers=[{person:'meera',dept:'Customer Support'}];s.savedObservers=copy(s.observers);s.assigned=status(s)==='active'?['ananya','rohan','neha','priya']:[];s.dialog=null;s.search='';s.page=1;s.notice=null;render(k);persist(k)}
function updateStatus(k){const r=roots[k],s=states[k];r.querySelector('[data-action="save-rule"]').disabled=!dirty(s);r.querySelector('.ad-status').classList.toggle('dirty',dirty(s));r.querySelector('.ad-status span').textContent=dirty(s)?'Unsaved employee rule changes':'Employee rule saved';const dueEl=r.querySelector('.ad-due-summary');if(dueEl)dueEl.textContent=due(s)}
for(const [k,root] of Object.entries(roots)){
root.addEventListener('input',e=>{const s=states[k],t=e.target,f=t.dataset.field;if(f==='search'){s.search=t.value;s.page=1;const list=(s.view==='matching'?matches(s):people.filter(p=>s.assigned.includes(p.id))).filter(p=>(p.name+' '+p.dept).toLowerCase().includes(s.search.toLowerCase()));root.querySelector('.ad-preview-results').innerHTML=previewResults(s,list,list.slice(0,3),Math.max(1,Math.ceil(list.length/3)));if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});persist(k)}else if(f==='days'||f==='date'){s.rule[f]=f==='days'?(t.value===''?'':Number(t.value)):t.value;updateStatus(k);persist(k)}});
root.addEventListener('change',e=>{const s=states[k],d=e.target.dataset;if(d.field==='all'){s.rule.all=e.target.checked;s.page=1;render(k);persist(k)}if(d.field==='course'){const id=e.target.value;if(dirty(s)||observerDirty(s)){s.dialog={type:'switch',id};render(k)}else switchCourse(k,id)}if(d.observer!==undefined){s.observers[Number(d.observer)][d.kind]=e.target.value;render(k);persist(k)}if(d.pick){s.dialog.picks=e.target.checked?[...s.dialog.picks,d.pick]:s.dialog.picks.filter(x=>x!==d.pick)}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset,s=states[k];if(d.nav){if(d.nav!=='Assign')notice(k,'This comparison focuses on Assign. Other tabs keep their normal application navigation.');return}if(d.course){if(d.course===s.selected)return;if(dirty(s)||observerDirty(s)){s.dialog={type:'switch',id:d.course};render(k)}else switchCourse(k,d.course);return}if(d.tab){s.tab=d.tab;render(k);persist(k);return}if(d.mode){s.rule.mode=d.mode;render(k);persist(k);return}if(d.view){s.view=d.view;s.page=1;render(k);persist(k);return}if(d.page){s.page+=d.page==='next'?1:-1;render(k);persist(k);return}if(d.removeDept){s.rule.depts=s.rule.depts.filter(x=>x!==d.removeDept);s.page=1;render(k);persist(k);return}if(d.unexclude){s.rule.excludes=s.rule.excludes.filter(x=>x!==d.unexclude);render(k);persist(k);return}if(d.removeObserver!==undefined){s.observers.splice(Number(d.removeObserver),1);render(k);persist(k);return}if(d.confirm){const dialog=s.dialog;if(d.confirm==='cancel')s.dialog=null;if(d.confirm==='picks'){if(dialog.type==='groups')s.rule.depts=dialog.picks;else s.rule.excludes=dialog.picks;s.page=1;s.dialog=null}if(d.confirm==='switch')return switchCourse(k,dialog.id);if(d.confirm==='publish'){s.courseStates[s.selected]='active';s.assigned=matches(s).map(p=>p.id);s.savedRule=copy(s.rule);s.dialog=null;notice(k,'Assignments updated in this preview. Observer access is unchanged.','success');persist(k);return}if(d.confirm==='lifecycle'){s.courseStates[s.selected]=dialog.type==='disable'?'disabled':'draft';s.dialog=null;notice(k,dialog.type==='disable'?'Sample course disabled.':'Sample draft deletion confirmed. No real data was deleted.');persist(k);return}if(d.confirm==='apply-observers'){s.dialog=null;notice(k,'Observer performance access applied in this preview. No learners were enrolled.','success');persist(k);return}render(k);persist(k);return}switch(d.action){case'dismiss':s.notice=null;break;case'groups':s.dialog={type:'groups',picks:[...s.rule.depts]};break;case'exclusions':s.dialog={type:'exclusions',picks:[...s.rule.excludes]};break;case'toggle-observers':s.observersOpen=!s.observersOpen;break;case'add-observer':s.observers.push({person:'sana',dept:'Customer Support'});break;case'save-observers':if(new Set(s.observers.map(o=>o.person)).size!==s.observers.length){notice(k,'Choose each observer only once.','error');return}s.savedObservers=copy(s.observers);notice(k,'Observer selections saved. Apply access separately.','success');persist(k);return;case'apply-observers':s.dialog={type:'apply-observers'};break;case'save-rule':{const v=validation(s);if(v){notice(k,v,'error');return}s.savedRule=copy(s.rule);notice(k,'Employee rule saved in this preview. Access has not changed.','success');persist(k);return}case'publish':{const v=validation(s);if(v){notice(k,v,'error');return}s.dialog={type:'publish'};break}case'refresh':notice(k,'Sample preview refreshed. Your employee and observer edits are preserved.');return;case'lifecycle':s.dialog={type:status(s)==='active'?'disable':'delete'};break;default:return}render(k);persist(k)});
root.addEventListener('keydown',e=>{const s=states[k];if(!s.dialog)return;if(e.key==='Escape'){s.dialog=null;render(k);return}if(e.key==='Tab'){const els=[...root.querySelectorAll('.ad-dialog button,.ad-dialog input')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render(k);
}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
