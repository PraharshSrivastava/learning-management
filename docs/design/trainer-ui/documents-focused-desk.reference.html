</style>
<div id="pc-focused-uploaded" aria-label="Focused desk — uploaded documents">
  <section aria-label="Focused desk document workspace"><div class="pc-app" data-design="focused" aria-label="Focused desk appearance"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('pc-focused-uploaded');
const docs=[
{id:'service',name:'Customer Service Essentials',type:'PDF',size:'1.4 MB',pages:8,date:'Today',section:'Listening before responding',copy:'Listen fully, acknowledge the concern, explain the next step and follow up at the agreed time.',takeaway:'Promise a clear next step and a reliable update time.'},
{id:'crm',name:'PhillipX CRM User Guide',type:'PDF',size:'3.2 MB',pages:18,date:'Yesterday',section:'Recording a client interaction',copy:'Record a useful summary, confirm ownership and set a follow-up date before closing the interaction.',takeaway:'Keep each client interaction clear, accurate and actionable.'},
{id:'security',name:'Information Security Essentials',type:'DOCX',size:'640 KB',pages:10,date:'20 Oct',section:'Recognising suspicious messages',copy:'Pause before opening unexpected links or attachments. Verify unusual requests using a trusted contact channel.',takeaway:'Report a suspected incident through your approved internal process.'},
{id:'onboarding',name:'New Employee Onboarding',type:'PDF',size:'2.1 MB',pages:12,date:'19 Oct',section:'Your first week',copy:'Meet your team, understand your responsibilities and practise the systems required for your role.',takeaway:'Ask your manager when a process or responsibility is unclear.'},
{id:'communication',name:'Professional Workplace Communication',type:'PPTX',size:'4.8 MB',pages:14,date:'18 Oct',section:'Making the next step clear',copy:'Use plain language, confirm understanding and agree who will act next.',takeaway:'A useful message makes the action, owner and timing easy to understand.'},
{id:'brand',name:'Brand and Client Experience',type:'PDF',size:'1.8 MB',pages:9,date:'17 Oct',section:'Consistent client experiences',copy:'Build trust through clear communication, accurate information and dependable follow-through.',takeaway:'Consistency is created through everyday actions.'},
{id:'remote',name:'Working Effectively Across Teams',type:'DOCX',size:'710 KB',pages:7,date:'15 Oct',section:'Handovers that work',copy:'Share relevant context, record the next action and confirm that the receiving person understands the handover.',takeaway:'A good handover avoids uncertainty about the next step.'}
];
const draftRows=[{id:'d1',title:'Customer Service Essentials',meta:'4 modules · Edited 12 minutes ago'},{id:'d2',title:'Information Security Basics',meta:'4 modules · Edited yesterday'},{id:'d3',title:'Manager Communication',meta:'Outline ready · Edited 20 Oct'},{id:'d4',title:'New Employee Orientation',meta:'4 modules · Edited 19 Oct'},{id:'d5',title:'CRM Refresher',meta:'2 modules · Edited 18 Oct'}];
const moduleNames=['Listen and understand','Respond with empathy','Explain the next step','Follow up reliably'];
const names={focused:'Focused desk'};
const defaults=()=>({screen:'home',selected:'service',showAll:false,allDrafts:false,query:'',notice:'none',progress:0,removed:null,title:'Customer Service Essentials',audience:'New customer service employees',goals:'Listen actively, acknowledge concerns, explain next steps and follow up reliably.',module:0,assistant:false,suggestion:false,edited:false,image:false,approved:false,history:false,edits:{},pdfPage:1,pdfZoom:100});
const states={};const timers={};const designControls={};const localSession='pc-'+Math.random().toString(36).slice(2);let snapshotNumber=0;
const h=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>{const actual=name==='sparkles'?'sparkle':name;return `<i data-lucide="${actual}" ${actual==='sparkle'?'class="pc-ai-star"':''} aria-hidden="true"></i>`;};
function decorateAiIcons(app){const ns='http://www.w3.org/2000/svg';app.querySelectorAll('svg.pc-ai-star:not([data-pc-ai-painted])').forEach((svg,index)=>{svg.setAttribute('data-pc-ai-painted','true');const defs=document.createElementNS(ns,'defs'),gradient=document.createElementNS(ns,'linearGradient'),identity='pc-ai-sparkle-'+index;gradient.id=identity;for(const [name,value] of Object.entries({x1:'0%',y1:'0%',x2:'100%',y2:'100%'}))gradient.setAttribute(name,value);for(const [offset,color] of [['0%','#4787ff'],['55%','#8b5cf6'],['100%','#c779df']]){const stop=document.createElementNS(ns,'stop');stop.setAttribute('offset',offset);stop.setAttribute('stop-color',color);gradient.append(stop);}defs.append(gradient);svg.prepend(defs);svg.setAttribute('fill',`url(#${identity})`);svg.setAttribute('stroke',`url(#${identity})`);svg.setAttribute('stroke-width','1');});}
const button=(text,action,primary=false,extra='')=>`<button type="button" class="pc-button cursor-interaction ${primary?'pc-primary':''}" data-action="${action}" ${extra}>${text}</button>`;
function restore(saved){const privateState=saved?.privateContent||saved;for(const key of Object.keys(names)){const prior=privateState?.variants?.[key];states[key]={...defaults(),...(key==='split'?{selected:'service'}:{}),...(key==='library'?{notice:'unavailable'}:{}),...(prior&&typeof prior==='object'?prior:{})};if(!docs.some(d=>d.id===states[key].selected))states[key].selected=null;if(!['home','ai','upload','outline','editor','blueprint'].includes(states[key].screen))states[key].screen='home';}}
restore(window.openai?.widgetState?.modelContent?.demo==='Focused desk uploaded documents'?window.openai.widgetState:null);
function save(key){const variants=Object.fromEntries(Object.entries(states).map(([name,state])=>[name,{...state,edits:{}}]));if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{demo:'Focused desk uploaded documents',design:names[key],screen:states[key].screen,preview:states[key].selected,pdfPage:states[key].pdfPage,previewIncludesAllPages:true,uploadedDocumentActions:['Preview','Create course'],showAllDocuments:states[key].showAll,startBlankVisible:false,editorTools:['Bold','Italic','Heading','Image']},privateContent:{variants,stamp:localSession+'/'+(++snapshotNumber)}}).catch(()=>{});}
function status(s){
 if(s.notice==='none')return '';
 if(s.notice==='loading')return `<div class="pc-notice" role="status" aria-live="polite">${icon('loader-circle')}<div class="pc-notice-body"><strong>${s.progress<40?'Understanding your training goals':s.progress<80?'Organising your four modules':'Preparing your outline for review'}</strong>Your inputs are safe. You can review the outline before creating content.<div class="pc-meter" role="progressbar" aria-label="Outline generation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.progress}"><span style="width:${s.progress}%"></span></div></div>${button('Cancel','cancel')}</div>`;
 if(s.notice==='unavailable')return `<div class="pc-notice pc-warn" role="alert">${icon('triangle-alert')}<div class="pc-notice-body"><strong>Document model is unavailable</strong>We couldn’t reach the AI service. Your work is safe. Try again or continue editing.</div>${button('Try again','retry')}${button('Dismiss','dismiss')}</div>`;
 if(s.notice==='validation')return `<div class="pc-notice pc-error" role="alert">${icon('circle-alert')}<div class="pc-notice-body"><strong>Add your training details</strong>Complete the topic, audience and learning goals before generating an outline.</div></div>`;
 if(s.notice==='removed')return `<div class="pc-notice pc-success" role="status" aria-live="polite">${icon('check-circle-2')}<div class="pc-notice-body"><strong>Draft removed</strong>You can undo this action.</div>${button('Undo','undo')}${button('Dismiss','dismiss')}</div>`;
 return `<div class="pc-notice pc-success" role="status" aria-live="polite">${icon('check-circle-2')}<div class="pc-notice-body"><strong>${s.notice==='saved'?'All changes saved':s.notice==='course'?'Course generation started':'Your outline is ready'}</strong>${s.notice==='course'?'Track video and quiz progress in Courses.':s.notice==='saved'?'Your latest edits are available when you return.':'Review the modules and choose what happens next.'}</div>${button('Dismiss','dismiss')}</div>`;
}
const sampleSections=[
 {title:'Purpose and learning outcomes',lead:'A consistent service conversation helps customers feel heard and makes the next step easy to understand.',sub:'What employees should be able to do',body:'Listen without interrupting. Acknowledge the concern. Explain an appropriate next step in plain language. Agree on an update time and follow through.',example:'A customer asks for an update after waiting longer than expected. Start by understanding what happened and what they need now.',takeaway:'A good conversation creates clarity about the concern, the next action and the follow-up.'},
 {title:'Listen and understand the concern',lead:'Give the customer room to explain. Avoid preparing your response while they are still speaking.',sub:'Confirm the important details',body:'Ask a useful open question, listen to the answer and summarise your understanding. Separate what you know from what you still need to check.',example:'“Let me make sure I have understood. You expected an update yesterday, and you would like to know the current status. Is that correct?”',takeaway:'Confirm your understanding before proposing a solution.'},
 {title:'Respond with empathy',lead:'Acknowledge the customer’s experience without assuming facts or promising an outcome you cannot guarantee.',sub:'Use calm, specific language',body:'Recognise the concern and its impact. Keep your tone respectful. Avoid language that dismisses the customer’s experience or shifts responsibility without explanation.',example:'“I understand why the delay is frustrating. Let me check the details so I can explain the next step clearly.”',takeaway:'Empathy means recognising the person’s perspective and responding respectfully.'},
 {title:'Explain the next step clearly',lead:'A useful explanation tells the customer what happens next, who will act and when they can expect an update.',sub:'Make the explanation easy to follow',body:'Use short sentences and familiar words. Explain one action at a time. Check understanding and give the customer an opportunity to ask a question.',example:'“I will send the details to the responsible team today. I will update you by tomorrow afternoon, even if the final response is still pending.”',takeaway:'State the action, its owner and the expected update time.'},
 {title:'Follow up reliably',lead:'Keep the commitment you made. If circumstances change, communicate before the agreed update time where possible.',sub:'Close the loop',body:'Record the enquiry, the action agreed and the follow-up time. Check progress before contacting the customer. If the matter remains unresolved, follow the approved escalation process.',example:'“As agreed, I’m updating you today. The review is still in progress. The next update will be on Thursday afternoon.”',takeaway:'An update can be useful even when the final outcome is not yet available.'},
 {title:'Workplace scenario',lead:'A customer has contacted the team twice about the same unresolved enquiry and is concerned that nobody is taking ownership.',sub:'Practise the complete conversation',body:'Invite the customer to explain the concern. Summarise what you heard, acknowledge the repeated effort and explain the action you can take. Confirm when you will follow up.',example:'“You have already contacted us twice, and you need a clear update. I will check the enquiry and confirm the next action with you by 3 pm today.”',takeaway:'Show ownership through a clear, realistic action and dependable follow-up.'},
 {title:'Quick reference for daily use',lead:'Use these four checks before ending a service conversation.',sub:'Confirm the conversation is complete',body:'Understanding: have I confirmed the concern? Empathy: have I acknowledged the customer’s experience? Clarity: have I explained the next action? Follow-up: have we agreed on an update time?',example:'Before closing an enquiry, read your summary and ask whether another employee could understand the concern and continue the work.',takeaway:'A clear record supports a reliable handover and consistent service.'},
 {title:'Summary and reflection',lead:'Good service combines active listening, respectful acknowledgement, clear next steps and reliable follow-through.',sub:'Apply the learning',body:'Think of a recent conversation. What did the customer need? How did you confirm understanding? Was the next action clear? Did you provide the update you agreed to give?',example:'Choose one improvement to practise in your next conversation, such as summarising the concern before explaining a solution.',takeaway:'Listen, acknowledge, explain and follow up. Practise the complete sequence.'}
];
function pdfPage(doc,index){const sample=sampleSections[index%sampleSections.length];const specific=doc.id==='service';return `<article class="pc-pdf-page" data-pdf-page="${index+1}" aria-label="Page ${index+1} of ${doc.pages}"><div class="pc-pdf-page-top"><span>PhillipCapital</span><span>TRAINING GUIDE</span></div><p class="pc-pdf-section">${h(doc.name)} · ${index===0?'Introduction':index===doc.pages-1?'Summary':`Section ${index+1}`}</p><h3>${h(specific?sample.title:index===0?'Overview and learning outcomes':index===doc.pages-1?'Summary and next steps':`${doc.section} — ${index+1}`)}</h3><p>${h(specific?sample.lead:doc.copy)}</p><h4>${h(specific?sample.sub:'Practical guidance')}</h4><p>${h(specific?sample.body:doc.copy+' Work through the steps carefully and confirm your understanding before continuing.')}</p><h4>Example in practice</h4><p>${h(specific?sample.example:'Apply the guidance in a realistic workplace situation. Record the action taken and confirm the next step with the relevant person.')}</p><div class="pc-pdf-takeaway"><strong>Key takeaway</strong><p>${h(specific?sample.takeaway:doc.takeaway)}</p></div><div class="pc-pdf-page-end"><span>Internal training · Sample document</span><span>${index+1} / ${doc.pages}</span></div></article>`;}
function preview(doc,inline=false){const s=states.focused;return `<section class="pc-full-preview" role="region" aria-label="Complete document preview"><header class="pc-full-preview-head"><div><h3>${icon('file-text')} ${h(doc.name)}</h3><p class="pc-sub">Read-only preview · Complete document · ${doc.pages} pages</p></div><div class="pc-inline">${button(`${icon('book-open')} Create course`,'create-course',true,`data-id="${doc.id}"`)}${button(`${icon('x')} Close`,'close-preview',false,'aria-label="Close preview"')}</div></header><div class="pc-pdf-toolbar" role="toolbar" aria-label="PDF viewer controls"><div class="pc-inline"><span class="pc-pdf-label">Page</span><button type="button" class="pc-icon-button cursor-interaction" data-action="pdf-prev" aria-label="Previous page" ${s.pdfPage<=1?'disabled':''}>${icon('chevron-left')}</button><input type="number" class="pc-pdf-jump" aria-label="PDF page number" min="1" max="${doc.pages}" value="${s.pdfPage}"><span class="pc-pdf-label">of ${doc.pages}</span><button type="button" class="pc-icon-button cursor-interaction" data-action="pdf-next" aria-label="Next page" ${s.pdfPage>=doc.pages?'disabled':''}>${icon('chevron-right')}</button></div><div class="pc-inline"><button type="button" class="pc-icon-button cursor-interaction" data-action="pdf-minus" aria-label="Zoom out" ${s.pdfZoom<=75?'disabled':''}>${icon('minus')}</button><output class="pc-pdf-label" aria-label="Zoom level">${s.pdfZoom}%</output><button type="button" class="pc-icon-button cursor-interaction" data-action="pdf-plus" aria-label="Zoom in" ${s.pdfZoom>=150?'disabled':''}>${icon('plus')}</button>${button(`${icon('scan-line')} Fit width`,'pdf-fit')}</div></div><section class="pc-pdf-viewport" aria-label="All ${doc.pages} document pages" style="--pc-pdf-scale:${s.pdfZoom/100}">${Array.from({length:doc.pages},(_,index)=>pdfPage(doc,index)).join('')}</section><footer class="pc-pdf-footer"><span>${icon('check-circle-2')} All ${doc.pages} pages available</span><span>Scroll to read · Use page controls to jump</span></footer></section>`;}
function creation(compact=false){return compact?`<div class="pc-inline">${button(`${icon('cloud-upload')} Use existing content`,'upload')}${button(`${icon('sparkles')} Generate with AI`,'ai',true)}</div>`:`<div class="pc-create-grid"><button type="button" class="pc-create cursor-interaction" data-action="upload"><span class="pc-emblem">${icon('cloud-upload')}</span><span><strong>Use existing content</strong><small>Upload a ready document. Open Blueprint.</small></span><span class="pc-arrow">${icon('arrow-up-right')}</span></button><button type="button" class="pc-create cursor-interaction" data-action="ai"><span class="pc-emblem">${icon('sparkles')}</span><span><strong>Generate with AI</strong><small>Share a topic. Review an AI draft.</small></span><span class="pc-arrow">${icon('arrow-up-right')}</span></button></div>`;}
function drafts(s,compact=false){const available=draftRows.filter(d=>d.id!==s.removed);const shown=available.slice(0,s.allDrafts?available.length:compact?2:3);return `<section class="pc-panel" aria-label="Recent drafts"><header class="pc-panel-head"><h2>Recent drafts</h2><button type="button" class="pc-button pc-quiet cursor-interaction" data-action="all-drafts">${s.allDrafts?'Show recent':`View all (${available.length})`}</button></header>${shown.map(d=>`<div class="pc-draft-row"><span class="pc-file-icon">${icon('file-pen-line')}</span><div class="pc-draft-title"><strong>${h(d.title)}</strong><small>${h(d.meta)}</small></div>${button('Open','open-draft',false,`data-id="${d.id}"`)}<button class="pc-icon-button cursor-interaction" type="button" data-action="remove" data-id="${d.id}" aria-label="Remove ${h(d.title)}">${icon('trash-2')}</button></div>`).join('')}</section>`;}
function documents(s,key){
 const filtered=docs.filter(d=>d.name.toLowerCase().includes(s.query.toLowerCase()));
 const shown=filtered.slice(0,s.showAll?filtered.length:5);
 return `<section class="pc-panel" aria-label="Your uploaded documents"><header class="pc-panel-head"><div><h2>Your uploaded documents <small>${docs.length} files</small></h2><p class="pc-sub">Ready documents to turn into courses.</p></div><label class="pc-search">${icon('search')}<input aria-label="Search documents" data-field="query" placeholder="Search documents…" value="${h(s.query)}"></label></header>${shown.map(d=>`<div class="pc-doc-row ${s.selected===d.id?'pc-selected':''}" data-document="${d.id}"><span class="pc-file-icon">${icon(d.type==='PPTX'?'presentation':d.type==='DOCX'?'file-pen-line':'file-text')}</span><div class="pc-doc-info"><strong>${h(d.name)}</strong><small>${d.type} · ${d.size} · ${d.date}</small></div><div class="pc-doc-actions">${button(`${icon('eye')} ${s.selected===d.id?'Close preview':'Preview'}`,'preview',false,`data-id="${d.id}" aria-expanded="${s.selected===d.id}"`)}${button(`${icon('book-open')} Create course`,'create-course',false,`data-id="${d.id}"`)}</div></div>${s.selected===d.id?preview(d,true):''}`).join('')}${!shown.length?'<div class="pc-empty">No matching documents. Try another search.</div>':''}<footer class="pc-list-footer"><span>Showing ${shown.length} of ${filtered.length} ${s.query?'matching ':''}documents</span>${filtered.length>5?button(s.showAll?'Show recent documents':`View all documents (${filtered.length})`,'all-documents'):''}</footer></section>`;
}
function home(s,key){const heading=`<div class="pc-heading"><div><p class="pc-kicker">Trainer workspace</p><h1>Documents</h1><p class="pc-sub">Create training content. Keep every document within reach.</p></div>${key==='library'?creation(true):''}</div>`;return `${heading}${status(s)}${key==='library'?`<div class="pc-workbench"><div>${documents(s,key)}</div><aside>${drafts(s,true)}<div class="pc-sub" style="padding:0 8px">Upload ready material or let AI help you create a first draft.</div></aside></div>`:`${creation()}${key==='focused'?`${drafts(s)}${documents(s,key)}`:`${documents(s,key)}${drafts(s,true)}`}`}`;}
function setup(s){return `<div class="pc-back">${button(`${icon('arrow-left')} Documents`,'home')}</div>${status(s)}<section class="pc-panel pc-form"><span class="pc-emblem">${icon('sparkles')}</span><h1 style="margin-top:18px">What would you like to teach?</h1><p class="pc-sub">Three essentials. AI prepares an outline for your review.</p><label>Topic or title<input class="pc-field" data-field="title" value="${h(s.title)}"></label><label>Who is this for?<input class="pc-field" data-field="audience" value="${h(s.audience)}"></label><label>What should employees be able to do?<textarea class="pc-field" rows="3" data-field="goals">${h(s.goals)}</textarea></label><details><summary>Customise generation · optional</summary><p class="pc-sub">Default — 4 modules · Standard length · Workplace scenarios included</p></details>${button(`${icon('sparkles')} Generate outline`,'generate',true,s.notice==='loading'?'disabled':'')}</section>`;}
function upload(s){return `<div class="pc-back">${button(`${icon('arrow-left')} Documents`,'home')}</div>${status(s)}<section class="pc-panel pc-form"><h1>Use existing content</h1><p class="pc-sub">Your ready document goes directly to Blueprint.</p><div class="pc-upload">${icon('cloud-upload')}<h2>Upload your training document</h2><p>PDF, DOCX or PPTX · Up to 20 MB</p>${button('Try with a sample document','sample-upload',true)}<p>Sample: Customer Service Essentials.pdf</p></div><p class="pc-sub">Already uploaded? Return to Your documents and choose Create course.</p></section>`;}
function outline(s,blueprint=false){return `<div class="pc-back">${button(`${icon('arrow-left')} Documents`,'home')}</div>${status(s)}<section class="pc-panel pc-form"><p class="pc-kicker">${blueprint?'Course Blueprint':'Outline review'}</p><h1>${h(s.title)}</h1><p class="pc-sub">4 modules · Videos and quizzes · English</p><div style="margin-top:24px">${moduleNames.map((name,i)=>`<div class="pc-outline-row"><span class="pc-step-num">${i+1}</span><div><h3>${h(name)}</h3><small>${['Understand the concern before offering a solution.','Acknowledge how the customer feels.','Make the action, owner and timing clear.','Close the loop and confirm understanding.'][i]}</small></div></div>`).join('')}</div><div class="pc-inline" style="margin-top:22px">${button(blueprint?`${icon('clapperboard')} Generate videos and quizzes`:`${icon('check')} Approve and create course`,blueprint?'generate-course':'approve-course',true)}${button(blueprint?'Back to uploaded documents':'Review in editor',blueprint?'home':'open-editor')}</div><p class="pc-sub">${blueprint?'Review the outline before starting course generation.':'You choose whether to create the course now or improve the document first.'}</p></section>`;}
function editor(s){return `<div class="pc-heading"><div>${button(`${icon('arrow-left')} Documents`,'home')}<h1 style="margin-top:15px">${h(s.title)}</h1><p class="pc-sub">${s.edited?'Unsaved changes':'All changes saved'}</p></div><div class="pc-inline">${button(`${icon('history')} History`,'history')}${button(`${icon('sparkles')} Improve with AI`,'assistant')}${button('Save draft','save')}${button('Create course','approve-course',true)}</div></div>${status(s)}<div class="pc-editor-grid"><aside class="pc-panel pc-module-nav"><h3>Modules</h3>${moduleNames.map((name,i)=>`<button type="button" class="pc-module-button cursor-interaction ${s.module===i?'pc-current':''}" data-action="module" data-index="${i}">${i+1}. ${name}</button>`).join('')}</aside><section class="pc-panel pc-edit-sheet"><p class="pc-kicker">Module ${s.module+1}</p><h2>${moduleNames[s.module]}</h2><div class="pc-toolbar" role="toolbar" aria-label="Document formatting">${button(`${icon('bold')} Bold`,'bold')}${button(`${icon('italic')} Italic`,'italic')}${button(`${icon('heading')} Heading`,'heading')}${button(`${icon('image')} Image`,'image')}</div><div class="pc-editor-text" contenteditable="true" role="textbox" aria-label="Module content" aria-multiline="true"><p>When a customer contacts you, they want to be heard and understand what happens next.</p><h3>${moduleNames[s.module]}</h3><p>Give the customer time to explain the concern. Use plain language, confirm what you have understood and agree on a realistic next step.</p><p>For example: “I understand why this is frustrating. Let me confirm the details and explain what we can do next.”</p><h3>Key takeaway</h3><p>Promise a clear next step and a reliable update time, and follow up as agreed.</p></div>${s.image?`<div class="pc-added-image">${icon('image')} Workplace scenario image<p class="pc-sub">Image placement preview</p></div>`:''}${s.assistant?`<aside class="pc-assistant" aria-label="AI assistant"><div class="pc-preview-head"><h3>${icon('sparkles')} AI assistant</h3>${button('Close','assistant')}</div><label>Apply to<select class="pc-field" aria-label="AI scope"><option>This module</option><option>Selected text</option><option>Complete document</option></select></label><textarea class="pc-field" rows="2" aria-label="AI instruction">Make this clearer for a new employee.</textarea>${button('Suggest changes','suggest',true)}${s.suggestion?`<div class="pc-preview-suggestion"><h3>Suggested wording</h3><p style="margin-top:10px">Listen first. Confirm the concern, explain the next step and agree when you will provide an update.</p><p class="pc-sub" style="border-top:1px solid var(--pc-line);padding-top:12px">Review notice: Your original text remains unchanged until you accept.</p><div class="pc-inline" style="margin-top:14px">${button('Accept changes','accept',true)}${button('Dismiss','dismiss-suggestion')}</div></div>`:''}</aside>`:''}</section></div>`;}
function render(key){const app=root.querySelector(`[data-design="${key}"]`),s=states[key];const focus=app.contains(document.activeElement)?document.activeElement:null,field=focus?.dataset.field,selection=typeof focus?.selectionStart==='number'?[focus.selectionStart,focus.selectionEnd]:null;
 app.innerHTML=`<header class="pc-nav"><span class="pc-wordmark">PhillipCapital</span><nav class="pc-navlinks" aria-label="Main navigation"><span class="pc-active">Documents</span><span>Blueprint</span><span>Courses</span><span>Assign</span><span>Performance</span></nav><span class="pc-avatar" aria-label="Trainer profile">GK</span></header><main class="pc-main">${s.screen==='home'?home(s,key):s.screen==='ai'?setup(s):s.screen==='upload'?upload(s):s.screen==='editor'?editor(s):outline(s,s.screen==='blueprint')}<footer class="pc-footer"><span>${icon('shield-check')} Trainer workspace</span><span>Interactive demo · Sample documents · AI and course outputs simulated</span></footer></main>${key==='library'&&s.screen==='home'&&s.selected?`<div class="pc-overlay"><section class="pc-dialog" role="dialog" aria-modal="true" aria-label="Document preview">${preview(docs.find(d=>d.id===s.selected))}</section></div>`:''}`;
 const text=app.querySelector('.pc-editor-text');if(text&&s.edits[s.module])text.replaceChildren(document.createTextNode(s.edits[s.module]));
 if(key==='split'&&s.selected){const panel=app.querySelector('.pc-split-preview'),row=app.querySelector(`[data-document="${s.selected}"]`);if(panel&&row){const inline=panel.cloneNode(true);inline.className='pc-split-inline';row.after(inline);}}
 if(key==='library'&&s.selected&&s.screen==='home'){app.querySelector('.pc-main').inert=true;app.querySelector('.pc-nav').inert=true;}
 if(s.history&&s.screen==='editor'){const panel=document.createElement('div');panel.className='pc-preview-suggestion';panel.setAttribute('role','region');panel.setAttribute('aria-label','Version history');panel.innerHTML=`<div class="pc-preview-head"><h3>Saved versions</h3>${button('Close history','history')}</div><p>Latest version · Today, 10:30</p><p class="pc-sub">Earlier version · Yesterday, 16:15</p><div style="margin-top:12px">${button('Restore earlier version','restore-version')}</div>`;app.querySelector('.pc-edit-sheet').prepend(panel);}
 if(globalThis.lucide){lucide.createIcons({attrs:{width:17,height:17}});decorateAiIcons(app);}if(field){const next=app.querySelector(`[data-field="${field}"]`);next?.focus();if(selection)next?.setSelectionRange(...selection);}if(app.querySelector('.pc-pdf-viewport'))requestAnimationFrame(()=>scrollPdf(key,s.pdfPage,false));
}
function scrollPdf(key,page,remember=true){const app=root.querySelector(`[data-design="${key}"]`),s=states[key],doc=docs.find(d=>d.id===s.selected),viewport=app.querySelector('.pc-pdf-viewport');if(!doc||!viewport)return;s.pdfPage=Math.max(1,Math.min(doc.pages,Number.isFinite(Number(page))?Math.trunc(Number(page)):1));const target=viewport.querySelector(`[data-pdf-page="${s.pdfPage}"]`);viewport.scrollTo({top:target.getBoundingClientRect().top-viewport.getBoundingClientRect().top+viewport.scrollTop-22,behavior:'auto'});app.querySelector('.pc-pdf-jump').value=s.pdfPage;syncPdfControls(app,s,doc);if(remember)save(key);}
function syncPdfControls(app,s,doc){const field=app.querySelector('.pc-pdf-jump');if(field&&document.activeElement!==field)field.value=s.pdfPage;const before=app.querySelector('[data-action="pdf-prev"]'),next=app.querySelector('[data-action="pdf-next"]');if(before)before.disabled=s.pdfPage<=1;if(next)next.disabled=s.pdfPage>=doc.pages;}
function clear(key){for(const timer of timers[key]||[])clearTimeout(timer);timers[key]=[];}
function generate(key){const s=states[key];clear(key);if(!s.title.trim()||!s.audience.trim()||!s.goals.trim()){s.notice='validation';render(key);return;}s.notice='loading';s.progress=25;render(key);timers[key]=[setTimeout(()=>{s.progress=65;render(key)},850),setTimeout(()=>{s.progress=90;render(key)},1500),setTimeout(()=>{s.progress=100;s.notice='ready';s.screen='outline';render(key);save(key)},2200)];}
for(const key of Object.keys(names)){
 const app=root.querySelector(`[data-design="${key}"]`);designControls[key]={notification:'Normal',compact:false};render(key);const iconObserver=new MutationObserver(()=>decorateAiIcons(app));iconObserver.observe(app,{childList:true,subtree:true});decorateAiIcons(app);
 app.addEventListener('input',event=>{const field=event.target.dataset.field;if(field){states[key][field]=event.target.value.slice(0,field==='goals'?1000:160);if(field==='query')render(key);save(key);}if(event.target.matches('.pc-editor-text')){states[key].edited=true;states[key].edits[states[key].module]=event.target.innerText.slice(0,4000);}});
 app.addEventListener('mousedown',event=>{if(event.target.closest('[data-action="bold"],[data-action="italic"],[data-action="heading"]'))event.preventDefault()});
 app.addEventListener('click',event=>{const trigger=event.target.closest('[data-action]');if(!trigger||trigger.disabled)return;const s=states[key],action=trigger.dataset.action,doc=docs.find(d=>d.id===trigger.dataset.id);if(['home','ai','upload','generate','retry','cancel','sample-upload','edit','open-draft','create-course','approve-course','remove'].includes(action))clear(key);
  if(action==='pdf-prev'||action==='pdf-next'){scrollPdf(key,s.pdfPage+(action==='pdf-next'?1:-1));return;}
  if(['pdf-plus','pdf-minus','pdf-fit'].includes(action)){s.pdfZoom=action==='pdf-fit'?100:Math.max(75,Math.min(150,s.pdfZoom+(action==='pdf-plus'?25:-25)));const viewport=app.querySelector('.pc-pdf-viewport');viewport.style.setProperty('--pc-pdf-scale',s.pdfZoom/100);app.querySelector('[aria-label="Zoom level"]').textContent=s.pdfZoom+'%';app.querySelector('[data-action="pdf-minus"]').disabled=s.pdfZoom<=75;app.querySelector('[data-action="pdf-plus"]').disabled=s.pdfZoom>=150;scrollPdf(key,s.pdfPage);return;}
  if(['bold','italic','heading'].includes(action)){document.execCommand(action==='heading'?'formatBlock':action,false,action==='heading'?'h3':undefined);s.edited=true;save(key);return;}
  if(action==='home'){s.screen='home';s.notice='none';s.selected=null;}
  if(action==='ai'){s.screen='ai';s.notice='none';}
  if(action==='upload'){s.screen='upload';s.notice='none';}
  if(action==='sample-upload'){s.title=docs[0].name;s.screen='blueprint';s.notice='none';}
  if(action==='preview'){s.selected=s.selected===doc.id?null:doc.id;s.pdfPage=1;s.pdfZoom=100;}
  if(action==='close-preview')s.selected=null;
  if(action==='all-documents')s.showAll=!s.showAll;
  if(action==='all-drafts')s.allDrafts=!s.allDrafts;
  if(action==='edit'){s.title=doc.name;s.screen='editor';s.notice='none';s.selected=null;}
  if(action==='open-draft'){s.title=draftRows.find(d=>d.id===trigger.dataset.id).title;s.screen='editor';s.notice='none';}
  if(action==='open-editor'){s.screen='editor';s.notice='none';}
  if(action==='create-course'){s.title=doc.name;s.screen='blueprint';s.notice='none';s.selected=null;}
  if(action==='approve-course'){s.approved=true;s.screen='blueprint';s.notice='none';}
  if(action==='generate-course'){s.notice='course';}
  if(action==='generate'||action==='retry'){generate(key);save(key);return;}
  if(action==='cancel'){s.notice='none';s.progress=0;}
  if(action==='remove'){s.removed=trigger.dataset.id;s.notice='removed';timers[key]=[setTimeout(()=>{if(s.notice==='removed'){s.notice='none';render(key);save(key)}},10000)];}
  if(action==='undo'){s.removed=null;s.notice='none';}
  if(action==='dismiss')s.notice='none';
  if(action==='module'){s.module=Number(trigger.dataset.index);s.suggestion=false;}
  if(action==='assistant')s.assistant=!s.assistant;
  if(action==='suggest')s.suggestion=true;
  if(action==='dismiss-suggestion')s.suggestion=false;
  if(action==='accept'){s.suggestion=false;s.edited=true;s.edits[s.module]='Listen first. Confirm the concern, explain the next step and agree when you will provide an update.';s.notice='none';}
  if(action==='image'){s.image=true;s.edited=true;}
  if(action==='save'){s.notice='saved';s.edited=false;}
  if(action==='history')s.history=!s.history;
  if(action==='restore-version'){s.edits[s.module]='Listen to the customer, confirm their concern and agree on a realistic next step.';s.history=false;s.notice='saved';s.edited=false;}
  render(key);save(key);
  if(key==='library'&&s.selected){app.querySelector('[aria-label="Close preview"]')?.focus();}
 });
 app.addEventListener('change',event=>{if(event.target.matches('.pc-pdf-jump'))scrollPdf(key,event.target.value)});
 app.addEventListener('scroll',event=>{if(!event.target.matches('.pc-pdf-viewport'))return;const viewport=event.target,s=states[key],doc=docs.find(d=>d.id===s.selected),bounds=viewport.getBoundingClientRect();if(!doc)return;const pages=[...viewport.querySelectorAll('[data-pdf-page]')];let best=null,area=0;for(const page of pages){const rect=page.getBoundingClientRect(),visible=Math.max(0,Math.min(bounds.bottom,rect.bottom)-Math.max(bounds.top,rect.top));if(visible>area){best=page;area=visible;}}if(best){s.pdfPage=Number(best.dataset.pdfPage);syncPdfControls(app,s,doc);}},true);
 app.addEventListener('keydown',event=>{if(event.target.matches('.pc-pdf-jump')&&event.key==='Enter'){event.preventDefault();scrollPdf(key,event.target.value)}if(event.key==='Escape'&&states[key].selected){const old=states[key].selected;states[key].selected=null;render(key);app.querySelector(`[data-action="preview"][data-id="${old}"]`)?.focus();save(key);}});
 if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{clear(key);const choice=designControls[key].notification;states[key].notice=choice==='Model unavailable'?'unavailable':choice==='Generating outline'?'loading':choice==='Saved successfully'?'saved':'none';states[key].progress=65;render(key);}});tweak.addSelect(designControls[key],'notification',{label:'Notification preview',options:['Normal','Model unavailable','Generating outline','Saved successfully']});}
}
window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved&&!saved.privateContent?.stamp?.startsWith(localSession+'/')){restore(saved);for(const key of Object.keys(names))render(key);}});
})();
</script>
